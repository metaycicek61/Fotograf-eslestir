<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Akıllı Formasyon AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#111;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.wrap{max-width:720px;margin:auto;padding:14px}
h1{text-align:center;font-size:21px;margin:8px 0 14px}

.cameraBox{
 position:relative;
 width:100%;
 aspect-ratio:15/12;
 background:#000;
 overflow:hidden;
 border-radius:14px;
 border:2px solid #555
}

video{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover
}

#overlay{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 z-index:3;
 pointer-events:none
}

button,.fileBtn{
 width:100%;
 border:0;
 border-radius:12px;
 padding:14px;
 margin-top:10px;
 font-size:16px;
 font-weight:700
}

#start{background:#28a745;color:white}
#scanToggle{background:#0d6efd;color:white}
#scanToggle.active{background:#dc3545}

.fileBtn{
 display:block;
 text-align:center;
 background:#6f42c1;
 color:white
}
.fileBtn input{display:none}

.card{
 margin-top:12px;
 padding:13px;
 border-radius:14px;
 background:#1d1d1d;
 border:1px solid #333
}

#status{
 text-align:center;
 font-size:14px;
 color:#ccc
}

.resultTitle{
 font-size:13px;
 color:#aaa
}

#bestName{
 font-size:24px;
 font-weight:800;
 margin-top:5px
}

#bestScore{
 font-size:34px;
 font-weight:900;
 margin-top:3px
}

#details{
 font-size:14px;
 line-height:1.6;
 color:#ddd;
 margin-top:8px
}

.refGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-top:10px
}

.ref{
 background:#292929;
 border-radius:10px;
 overflow:hidden;
 text-align:center;
 font-size:12px
}

.ref img{
 width:100%;
 aspect-ratio:1/1;
 object-fit:contain;
 background:white
}

.ref div{
 padding:6px;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap
}

.small{
 font-size:12px;
 color:#aaa;
 line-height:1.4
}

#clear{
 background:#444;
 color:white;
 padding:10px
}

canvas#capture{display:none}
</style>
</head>

<body>
<div class="wrap">

<h1>📷 Akıllı Formasyon AI</h1>

<div class="cameraBox">
 <video id="video" autoplay playsinline muted></video>
 <canvas id="overlay"></canvas>
</div>

<button id="start">📷 Kamerayı Aç</button>
<button id="scanToggle">🧠 AI Taramayı Başlat</button>

<label class="fileBtn">
 ➕ Formasyon Ekle
 <input id="refInput" type="file" accept="image/*" multiple>
</label>

<div class="card">
 <div id="status">Kamera kapalı.</div>
</div>

<div class="card">
 <div class="resultTitle">EN İYİ EŞLEŞME</div>
 <div id="bestName">—</div>
 <div id="bestScore">—</div>
 <div id="details">
   Kamera açıldığında AI sağdaki son mum bölgesini tarayacak.
 </div>
</div>

<div class="card">
 <b>📚 Formasyon Kütüphanesi</b>
 <div class="small">
   AI yalnızca buraya eklediğin formasyonları arar.
 </div>
 <div id="refs" class="refGrid"></div>
 <button id="clear">Tüm Formasyonları Sil</button>
</div>

<canvas id="capture" width="450" height="360"></canvas>

</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const video=document.getElementById("video");
const overlay=document.getElementById("overlay");
const capture=document.getElementById("capture");

const startBtn=document.getElementById("start");
const scanBtn=document.getElementById("scanToggle");

const statusEl=document.getElementById("status");
const bestName=document.getElementById("bestName");
const bestScore=document.getElementById("bestScore");
const details=document.getElementById("details");

const refInput=document.getElementById("refInput");
const refsEl=document.getElementById("refs");
const clearBtn=document.getElementById("clear");

let references=[];
let extractor=null;
let scanning=false;
let busy=false;
let timer=null;

const STORAGE="chartReferences";

/* ---------------------------
   KÜTÜPHANE
---------------------------- */

function loadRefs(){
 try{
   references=JSON.parse(localStorage.getItem(STORAGE)||"[]");
 }catch{
   references=[];
 }
 renderRefs();
}

function saveRefs(){
 localStorage.setItem(STORAGE,JSON.stringify(references));
}

function renderRefs(){

 refsEl.innerHTML="";

 if(!references.length){
   refsEl.innerHTML=
   '<div class="small">Henüz formasyon eklenmedi.</div>';
   return;
 }

 references.forEach((r,i)=>{

   const box=document.createElement("div");
   box.className="ref";

   const img=document.createElement("img");
   img.src=r.src;

   const name=document.createElement("div");
   name.textContent=r.name;

   box.appendChild(img);
   box.appendChild(name);

   box.onclick=()=>{

     const n=prompt("Formasyon adı:",r.name);

     if(n && n.trim()){
       references[i].name=n.trim();
       saveRefs();
       renderRefs();
     }
   };

   refsEl.appendChild(box);
 });
}

refInput.onchange=async e=>{

 const files=[...e.target.files];

 for(const file of files){

   const src=await fileToDataURL(file);

   references.push({
     name:file.name.replace(/\.[^.]+$/,""),
     src
   });
 }

 saveRefs();
 renderRefs();

 statusEl.textContent=
 `${files.length} formasyon eklendi.`;

 refInput.value="";
};

function fileToDataURL(file){

 return new Promise(resolve=>{

   const reader=new FileReader();

   reader.onload=()=>resolve(reader.result);

   reader.readAsDataURL(file);
 });
}

clearBtn.onclick=()=>{

 if(!confirm("Tüm formasyonlar silinsin mi?")) return;

 references=[];
 saveRefs();
 renderRefs();

 bestName.textContent="—";
 bestScore.textContent="—";
};

/* ---------------------------
   KAMERA
---------------------------- */

startBtn.onclick=async()=>{

 try{

   const stream=await navigator.mediaDevices.getUserMedia({
     video:{
       facingMode:{ideal:"environment"},
       width:{ideal:1280},
       height:{ideal:720}
     },
     audio:false
   });

   video.srcObject=stream;

   await video.play();

   drawGrid();

   statusEl.textContent=
   "Kamera açık — son mumları sağ tarafa hizala.";

 }catch(err){

   statusEl.textContent=
   "Kamera açılamadı. Safari kamera iznini kontrol et.";
 }
};

/* ---------------------------
   15 x 12 IZGARA
---------------------------- */

function drawGrid(highlight=false){

 const rect=overlay.getBoundingClientRect();

 const dpr=window.devicePixelRatio||1;

 overlay.width=rect.width*dpr;
 overlay.height=rect.height*dpr;

 const ctx=overlay.getContext("2d");

 ctx.setTransform(dpr,0,0,dpr,0,0);

 const W=rect.width;
 const H=rect.height;

 ctx.clearRect(0,0,W,H);

 ctx.lineWidth=1;

 for(let i=1;i<15;i++){

   const x=W*i/15;

   ctx.strokeStyle="rgba(255,255,255,.23)";

   ctx.beginPath();
   ctx.moveTo(x,0);
   ctx.lineTo(x,H);
   ctx.stroke();
 }

 for(let i=1;i<12;i++){

   const y=H*i/12;

   ctx.strokeStyle="rgba(255,255,255,.23)";

   ctx.beginPath();
   ctx.moveTo(0,y);
   ctx.lineTo(W,y);
   ctx.stroke();
 }

 /* AI'nin esas baktığı son mum bölgesi */
 const x=W*6/15;

 ctx.fillStyle=
 highlight
 ? "rgba(0,255,120,.13)"
 : "rgba(255,255,255,.025)";

 ctx.fillRect(x,0,W-x,H);

 ctx.strokeStyle=
 highlight
 ? "rgba(0,255,120,.9)"
 : "rgba(255,255,255,.55)";

 ctx.lineWidth=2;

 ctx.strokeRect(x+1,1,W-x-2,H-2);
}

window.addEventListener("resize",()=>drawGrid(false));

/* ---------------------------
   KAMERA GÖRÜNTÜSÜ
---------------------------- */

function captureLens(){

 const ctx=capture.getContext("2d");

 const W=450;
 const H=360;

 const vw=video.videoWidth;
 const vh=video.videoHeight;

 if(!vw || !vh) return null;

 const ratio=15/12;

 let sx=0,sy=0,sw=vw,sh=vh;

 if(vw/vh>ratio){

   sh=vh;
   sw=vh*ratio;

   sx=(vw-sw)/2;
   sy=0;

 }else{

   sw=vw;
   sh=vw/ratio;

   sx=0;
   sy=(vh-sh)/2;
 }

 ctx.drawImage(
   video,
   sx,sy,sw,sh,
   0,0,W,H
 );

 return capture;
}

/* ---------------------------
   SABİT AI TARAMA ALANLARI

   Tüm grafik yerine sağdaki
   son mumlara giderek yaklaşır.
---------------------------- */

function makeScanWindows(source){

 const result=[];

 const W=source.width;
 const H=source.height;

 /*
   9 sütun
   7 sütun
   5 sütun
   sağ taraf
 */

 const columns=[9,7,5];

 for(const cols of columns){

   const width=Math.round(W*(cols/15));

   const c=document.createElement("canvas");

   c.width=320;
   c.height=320;

   const ctx=c.getContext("2d");

   ctx.fillStyle="white";
   ctx.fillRect(0,0,320,320);

   const temp=document.createElement("canvas");

   temp.width=width;
   temp.height=H;

   temp.getContext("2d").drawImage(
     source,
     W-width,0,width,H,
     0,0,width,H
   );

   const scale=Math.min(
     320/width,
     320/H
   );

   const dw=width*scale;
   const dh=H*scale;

   ctx.drawImage(
     temp,
     (320-dw)/2,
     (320-dh)/2,
     dw,dh
   );

   result.push({
     canvas:c,
     cols
   });
 }

 return result;
}

/* ---------------------------
   REFERANS GÖRÜNTÜ
---------------------------- */

function loadImage(src){

 return new Promise((resolve,reject)=>{

   const img=new Image();

   img.onload=()=>resolve(img);
   img.onerror=reject;

   img.src=src;
 });
}

async function referenceCanvas(src){

 const img=await loadImage(src);

 const c=document.createElement("canvas");

 c.width=320;
 c.height=320;

 const ctx=c.getContext("2d");

 ctx.fillStyle="white";
 ctx.fillRect(0,0,320,320);

 const scale=Math.min(
   300/img.width,
   300/img.height
 );

 const w=img.width*scale;
 const h=img.height*scale;

 ctx.drawImage(
   img,
   (320-w)/2,
   (320-h)/2,
   w,h
 );

 return c;
}

/* ---------------------------
   AI
---------------------------- */

async function loadAI(){

 if(extractor) return;

 statusEl.textContent=
 "AI modeli hazırlanıyor… İlk açılış biraz sürebilir.";

 extractor=await pipeline(
   "image-feature-extraction",
   "Xenova/clip-vit-base-patch32"
 );

 statusEl.textContent="AI hazır.";
}

async function vector(canvas){

 const output=await extractor(canvas);

 return Array.from(output.data);
}

function cosine(a,b){

 let dot=0;
 let aa=0;
 let bb=0;

 const n=Math.min(a.length,b.length);

 for(let i=0;i<n;i++){

   dot+=a[i]*b[i];
   aa+=a[i]*a[i];
   bb+=b[i]*b[i];
 }

 return dot/
 (Math.sqrt(aa)*Math.sqrt(bb)+1e-8);
}

/* ---------------------------
   RENK KARŞILAŞTIRMASI
---------------------------- */

function colorSignature(canvas){

 const ctx=canvas.getContext("2d");

 const W=canvas.width;
 const H=canvas.height;

 const data=
 ctx.getImageData(0,0,W,H).data;

 const parts=12;

 const sig=[];

 for(let p=0;p<parts;p++){

   const x1=Math.floor(W*p/parts);
   const x2=Math.floor(W*(p+1)/parts);

   let red=0;
   let green=0;

   for(let y=0;y<H;y+=4){

     for(let x=x1;x<x2;x+=3){

       const i=(y*W+x)*4;

       const r=data[i];
       const g=data[i+1];
       const b=data[i+2];

       if(r>g*1.18 && r>b*1.15 && r>80){
         red++;
       }

       if(g>r*1.12 && g>b*1.05 && g>70){
         green++;
       }
     }
   }

   if(red>green*1.15) sig.push("R");
   else if(green>red*1.15) sig.push("G");
   else sig.push("?");
 }

 return sig;
}

function colorMatch(a,b){

 let valid=0;
 let same=0;

 const n=Math.min(a.length,b.length);

 for(let i=0;i<n;i++){

   if(a[i]=="?" || b[i]=="?") continue;

   valid++;

   if(a[i]===b[i]) same++;
 }

 if(valid<3) return 0.5;

 return same/valid;
}

/* ---------------------------
   AI TARAMA
---------------------------- */

async function scan(){

 if(busy || !scanning) return;

 if(!video.videoWidth) return;

 if(!references.length){

   statusEl.textContent=
   "Önce en az bir formasyon ekle.";

   return;
 }

 busy=true;

 try{

   await loadAI();

   statusEl.textContent=
   "🧠 Son mumlar taranıyor…";

   const frame=captureLens();

   if(!frame) return;

   const windows=makeScanWindows(frame);

   const refData=[];

   for(const ref of references){

     const canvas=
     await referenceCanvas(ref.src);

     const vec=await vector(canvas);

     const colors=
     colorSignature(canvas);

     refData.push({
       ref,
       vec,
       colors
     });
   }

   let winner=null;

   for(const win of windows){

     const qVec=
     await vector(win.canvas);

     const qColors=
     colorSignature(win.canvas);

     for(const r of refData){

       const visual=
       cosine(qVec,r.vec);

       const colors=
       colorMatch(qColors,r.colors);

       /*
         Görsel yapı ana kriter.
         Renk güçlü destek kriteri.
       */

       let finalScore=
       (visual*0.78)+
       (colors*0.22);

       /*
         Renk uyumu %80 üzerindeyse
         küçük destek.
       */

       if(colors>=0.80){
         finalScore+=0.025;
       }

       if(
         !winner ||
         finalScore>winner.finalScore
       ){

         winner={
           name:r.ref.name,
           visual,
           colors,
           finalScore,
           cols:win.cols
         };
       }
     }
   }

   if(winner){

     /*
       CLIP cosine değerini
       kullanıcı için anlaşılır
       benzerlik ölçeğine çevir.
       Bu bir olasılık değildir.
     */

     const visualDisplay=
     Math.max(
       0,
       Math.min(
         100,
         ((winner.visual-0.40)/0.45)*100
       )
     );

     const colorDisplay=
     winner.colors*100;

     const displayScore=
     Math.max(
       0,
       Math.min(
         100,
         visualDisplay*0.78+
         colorDisplay*0.22
       )
     );

     bestName.textContent=
     winner.name;

     bestScore.textContent=
     "%"+displayScore.toFixed(0);

     details.innerHTML=
     "Görsel benzerlik: <b>%"+
     visualDisplay.toFixed(0)+
     "</b><br>"+
     "Mum renk uyumu: <b>%"+
     colorDisplay.toFixed(0)+
     "</b><br>"+
     "Tarama alanı: son <b>"+
     winner.cols+
     "</b> ızgara sütunu";

     if(winner.colors>=0.80){

       statusEl.textContent=
       "🎯 Formasyon ve mum renkleri güçlü eşleşiyor.";

       drawGrid(true);

     }else{

       statusEl.textContent=
       "Formasyon benziyor ancak mum renkleri yeterince güçlü değil.";

       drawGrid(false);
     }
   }

 }catch(err){

   console.error(err);

   statusEl.textContent=
   "AI taramasında hata oluştu.";

 }finally{

   busy=false;
 }
}

/* ---------------------------
   CANLI TARAMA
---------------------------- */

scanBtn.onclick=async()=>{

 if(!video.srcObject){

   statusEl.textContent=
   "Önce kamerayı aç.";

   return;
 }

 if(!references.length){

   statusEl.textContent=
   "Önce formasyon kütüphanesine örnek ekle.";

   return;
 }

 scanning=!scanning;

 if(scanning){

   scanBtn.textContent=
   "⏹ AI Taramayı Durdur";

   scanBtn.classList.add("active");

   statusEl.textContent=
   "AI canlı tarama başlıyor…";

   await scan();

   timer=setInterval(scan,1800);

 }else{

   scanBtn.textContent=
   "🧠 AI Taramayı Başlat";

   scanBtn.classList.remove("active");

   clearInterval(timer);

   timer=null;

   statusEl.textContent=
   "AI tarama durduruldu.";

   drawGrid(false);
 }
};

loadRefs();

</script>
</body>
</html>
