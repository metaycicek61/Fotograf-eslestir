<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Fotoğraf Eşleştir</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  padding:20px;
  background:#f2f2f7;
  text-align:center;
}

h1{
  margin-top:25px;
}

.card{
  background:white;
  padding:18px;
  margin:16px 0;
  border-radius:18px;
}

.button,button{
  display:block;
  width:100%;
  box-sizing:border-box;
  border:0;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
  font-size:17px;
  font-weight:600;
  background:#007aff;
  color:white;
}

.delete{
  background:#ff3b30;
}

input[type=file]{
  display:none;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.refItem{
  position:relative;
}

.gallery img{
  width:100%;
  aspect-ratio:1;
  object-fit:contain;
  background:white;
  border-radius:10px;
}

.refNumber{
  position:absolute;
  left:5px;
  top:5px;
  background:rgba(0,0,0,.7);
  color:white;
  border-radius:20px;
  min-width:24px;
  height:24px;
  line-height:24px;
  font-size:13px;
  font-weight:bold;
}

.preview{
  max-width:100%;
  max-height:320px;
  object-fit:contain;
  border-radius:12px;
  margin-top:12px;
}

#result{
  font-size:19px;
  font-weight:bold;
  line-height:1.5;
}

#bestImage{
  max-width:100%;
  max-height:320px;
  object-fit:contain;
  border-radius:12px;
  display:none;
  margin:15px auto;
}

.smallText{
  font-size:14px;
  color:#666;
}
</style>
</head>

<body>

<h1>📷 Fotoğraf Eşleştir</h1>

<p>
Referans formasyonlarını ekle.
Sonra grafiğin fotoğrafını çek ve en yakın eşleşmeyi bul.
</p>

<div class="card">

<h2>Referans Fotoğraflar</h2>

<label class="button">
➕ Fotoğraf Ekle
<input
  id="referenceInput"
  type="file"
  accept="image/*"
  multiple
>
</label>

<div id="gallery" class="gallery"></div>

<button id="clearButton" class="delete">
Tüm Referansları Sil
</button>

<p id="count">0 fotoğraf kayıtlı</p>

</div>


<div class="card">

<h2>Karşılaştır</h2>

<label class="button">
📷 Kamerayla Fotoğraf Çek
<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
>
</label>

<img id="cameraPreview" class="preview">

<p id="result">
Fotoğraf bekleniyor…
</p>

<img id="bestImage">

<p id="bestLabel" class="smallText"></p>

</div>


<canvas
  id="canvas"
  width="64"
  height="64"
  style="display:none">
</canvas>


<script>

const referenceInput =
  document.getElementById("referenceInput");

const cameraInput =
  document.getElementById("cameraInput");

const gallery =
  document.getElementById("gallery");

const count =
  document.getElementById("count");

const result =
  document.getElementById("result");

const cameraPreview =
  document.getElementById("cameraPreview");

const bestImage =
  document.getElementById("bestImage");

const bestLabel =
  document.getElementById("bestLabel");

const clearButton =
  document.getElementById("clearButton");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext(
    "2d",
    {willReadFrequently:true}
  );

let references=[];


/* -------------------------
   REFERANSLARI YÜKLE
-------------------------- */

try{

  references =
    JSON.parse(
      localStorage.getItem("referencePhotos") || "[]"
    );

}catch(e){

  references=[];

}


/* -------------------------
   KAYDET
-------------------------- */

function saveReferences(){

  try{

    localStorage.setItem(
      "referencePhotos",
      JSON.stringify(references)
    );

  }catch(e){

    alert(
      "Telefon depolaması doldu. Daha az fotoğraf eklemeyi dene."
    );

  }

}


/* -------------------------
   GALERİ
-------------------------- */

function renderGallery(){

  gallery.innerHTML="";

  references.forEach((src,index)=>{

    const box =
      document.createElement("div");

    box.className="refItem";

    const img =
      document.createElement("img");

    img.src=src;

    const number =
      document.createElement("div");

    number.className="refNumber";
    number.textContent=index+1;

    box.appendChild(img);
    box.appendChild(number);

    gallery.appendChild(box);

  });

  count.textContent =
    references.length +
    " fotoğraf kayıtlı";

}


/* -------------------------
   DOSYAYI DATA URL YAP
-------------------------- */

function fileToDataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        ()=>resolve(reader.result);

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* -------------------------
   FOTOĞRAFI KÜÇÜLT
-------------------------- */

function resizeImage(
  dataUrl,
  maxSize=700
){

  return new Promise(
    (resolve,reject)=>{

      const img =
        new Image();

      img.onload=()=>{

        let w=img.width;
        let h=img.height;

        if(w>h && w>maxSize){

          h=
            Math.round(
              h*maxSize/w
            );

          w=maxSize;

        }

        else if(
          h>=w &&
          h>maxSize
        ){

          w=
            Math.round(
              w*maxSize/h
            );

          h=maxSize;

        }

        const c =
          document.createElement("canvas");

        c.width=w;
        c.height=h;

        const x =
          c.getContext("2d");

        x.fillStyle="white";

        x.fillRect(
          0,0,w,h
        );

        x.drawImage(
          img,
          0,0,w,h
        );

        resolve(
          c.toDataURL(
            "image/jpeg",
            0.82
          )
        );

      };

      img.onerror=reject;

      img.src=dataUrl;

    }
  );

}


/* -------------------------
   RESMİ 64x64'E SIĞDIR
-------------------------- */

function drawContained(img){

  ctx.fillStyle="white";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const scale =
    Math.min(
      canvas.width/img.width,
      canvas.height/img.height
    );

  const w =
    img.width*scale;

  const h =
    img.height*scale;

  const x =
    (canvas.width-w)/2;

  const y =
    (canvas.height-h)/2;

  ctx.drawImage(
    img,
    x,
    y,
    w,
    h
  );

}


/* -------------------------
   GÖRÜNTÜ ÖZELLİKLERİ
-------------------------- */

function imageFeatures(src){

  return new Promise(
    (resolve,reject)=>{

      const img =
        new Image();

      img.onload=()=>{

        drawContained(img);

        const imageData =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );

        const data =
          imageData.data;

        const gray=[];
        const edges=[];
        const colors=[];

        for(
          let y=0;
          y<canvas.height;
          y++
        ){

          for(
            let x=0;
            x<canvas.width;
            x++
          ){

            const p=
              (y*canvas.width+x)*4;

            const r=data[p];
            const g=data[p+1];
            const b=data[p+2];

            const v=
              r*0.299+
              g*0.587+
              b*0.114;

            gray.push(v);

            colors.push(
              r/255,
              g/255,
              b/255
            );

          }

        }


        for(
          let y=1;
          y<canvas.height-1;
          y++
        ){

          for(
            let x=1;
            x<canvas.width-1;
            x++
          ){

            const i=
              y*canvas.width+x;

            const gx=
              Math.abs(
                gray[i+1]-
                gray[i-1]
              );

            const gy=
              Math.abs(
                gray[i+canvas.width]-
                gray[i-canvas.width]
              );

            edges.push(
              Math.min(
                255,
                gx+gy
              )
            );

          }

        }

        resolve({
          gray,
          edges,
          colors
        });

      };

      img.onerror=reject;

      img.src=src;

    }
  );

}


/* -------------------------
   BENZERLİK
-------------------------- */

function arraySimilarity(a,b,maxValue){

  const length=
    Math.min(
      a.length,
      b.length
    );

  let diff=0;

  for(
    let i=0;
    i<length;
    i++
  ){

    diff+=
      Math.abs(
        a[i]-b[i]
      );

  }

  const max=
    length*maxValue;

  return Math.max(
    0,
    1-diff/max
  );

}


function similarity(a,b){

  const grayScore =
    arraySimilarity(
      a.gray,
      b.gray,
      255
    );

  const edgeScore =
    arraySimilarity(
      a.edges,
      b.edges,
      255
    );

  const colorScore =
    arraySimilarity(
      a.colors,
      b.colors,
      1
    );

  /*
     Formasyon şekline daha fazla
     önem veriyoruz.
  */

  const finalScore =
      edgeScore*0.55 +
      grayScore*0.30 +
      colorScore*0.15;

  return finalScore*100;

}


/* -------------------------
   REFERANS EKLE
-------------------------- */

referenceInput.addEventListener(
  "change",
  async function(){

    const files =
      Array.from(
        this.files || []
      );

    result.textContent =
      "Referanslar hazırlanıyor…";

    for(
      const file of files
    ){

      try{

        const original =
          await fileToDataURL(file);

        const small =
          await resizeImage(original);

        references.push(small);

      }catch(e){}

    }

    saveReferences();

    renderGallery();

    result.textContent =
      "Fotoğraf bekleniyor…";

    this.value="";

  }
);


/* -------------------------
   TÜM REFERANSLARI SİL
-------------------------- */

clearButton.addEventListener(
  "click",
  ()=>{

    if(
      confirm(
        "Tüm referans fotoğrafları silinsin mi?"
      )
    ){

      references=[];

      localStorage.removeItem(
        "referencePhotos"
      );

      renderGallery();

      bestImage.style.display=
        "none";

      bestLabel.textContent="";

      result.textContent=
        "Fotoğraf bekleniyor…";

    }

  }
);


/* -------------------------
   KARŞILAŞTIR
-------------------------- */

cameraInput.addEventListener(
  "change",
  async function(){

    const file=
      this.files[0];

    if(!file){
      return;
    }

    if(
      references.length===0
    ){

      result.textContent=
        "Önce en az bir referans fotoğraf ekle.";

      return;

    }

    result.textContent=
      "🔎 Formasyon aranıyor…";

    bestImage.style.display=
      "none";

    bestLabel.textContent="";

    try{

      const original =
        await fileToDataURL(file);

      const cameraImage =
        await resizeImage(original);

      cameraPreview.src=
        cameraImage;

      const target =
        await imageFeatures(
          cameraImage
        );

      let results=[];

      for(
        let i=0;
        i<references.length;
        i++
      ){

        const features =
          await imageFeatures(
            references[i]
          );

        const score =
          similarity(
            target,
            features
          );

        results.push({
          index:i,
          score:score,
          src:references[i]
        });

      }

      results.sort(
        (a,b)=>
          b.score-a.score
      );

      const best=
        results[0];

      bestImage.src=
        best.src;

      bestImage.style.display=
        "block";

      bestLabel.textContent=
        "Referans #" +
        (best.index+1);

      let message=
        "✅ En yakın eşleşme: Referans #" +
        (best.index+1) +
        "<br>" +
        "Benzerlik: %" +
        best.score.toFixed(1);

      if(results.length>1){

        message+=
          "<br><span style='font-size:14px;font-weight:normal'>" +
          "2. seçenek: Referans #" +
          (results[1].index+1) +
          " — %" +
          results[1].score.toFixed(1) +
          "</span>";

      }

      result.innerHTML=
        message;

    }catch(e){

      result.textContent=
        "Karşılaştırma sırasında hata oluştu.";

    }

    this.value="";

  }
);


renderGallery();

</script>


<script>

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker.register(
    "./service-worker.js"
  );

}

</script>

</body>
</html>
