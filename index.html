<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fotoğraf Eşleştir</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  padding:20px;
  background:#f2f2f7;
  text-align:center;
}
h1{margin-top:25px}
.card{
  background:white;
  padding:18px;
  margin:16px 0;
  border-radius:18px;
}
.button,button{
  display:block;
  width:100%;
  box-sizing:border-box;
  border:0;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
  font-size:17px;
  font-weight:600;
  background:#007aff;
  color:white;
}
.delete{background:#ff3b30}
input[type=file]{display:none}
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.gallery img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:10px;
}
.preview,#bestImage{
  max-width:100%;
  max-height:350px;
  border-radius:12px;
  margin:15px auto;
}
#bestImage{display:none}
#result{
  font-size:19px;
  font-weight:bold;
  line-height:1.5;
}
</style>
</head>

<body>

<h1>📷 Fotoğraf Eşleştir</h1>
<p>Mum grafiklerini şekil ve kenar yapısına göre karşılaştır.</p>

<div class="card">
<h2>Referans Fotoğraflar</h2>

<label class="button">
➕ Fotoğraf Ekle
<input id="referenceInput" type="file" accept="image/*" multiple>
</label>

<div id="gallery" class="gallery"></div>

<button id="clearButton" class="delete">
Tüm Referansları Sil
</button>

<p id="count">0 fotoğraf kayıtlı</p>
</div>

<div class="card">
<h2>Karşılaştır</h2>

<label class="button">
📷 Kamerayla Fotoğraf Çek
<input id="cameraInput" type="file" accept="image/*" capture="environment">
</label>

<img id="cameraPreview" class="preview">

<p id="result">Fotoğraf bekleniyor…</p>

<img id="bestImage">
</div>

<canvas id="canvas" width="64" height="64" style="display:none"></canvas>

<script>
const referenceInput=document.getElementById("referenceInput");
const cameraInput=document.getElementById("cameraInput");
const gallery=document.getElementById("gallery");
const count=document.getElementById("count");
const result=document.getElementById("result");
const cameraPreview=document.getElementById("cameraPreview");
const bestImage=document.getElementById("bestImage");
const clearButton=document.getElementById("clearButton");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});

let references=[];

try{
  references=JSON.parse(
    localStorage.getItem("referencePhotos") || "[]"
  );
}catch(e){
  references=[];
}

function saveReferences(){
  try{
    localStorage.setItem(
      "referencePhotos",
      JSON.stringify(references)
    );
  }catch(e){
    alert("Telefon depolaması doldu.");
  }
}

function renderGallery(){
  gallery.innerHTML="";

  references.forEach(src=>{
    const img=document.createElement("img");
    img.src=src;
    gallery.appendChild(img);
  });

  count.textContent=references.length+" fotoğraf kayıtlı";
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function resizeImage(dataUrl,maxSize=700){
  return new Promise((resolve,reject)=>{
    const img=new Image();

    img.onload=()=>{
      let w=img.width;
      let h=img.height;

      if(w>h && w>maxSize){
        h=Math.round(h*maxSize/w);
        w=maxSize;
      }else if(h>=w && h>maxSize){
        w=Math.round(w*maxSize/h);
        h=maxSize;
      }

      const c=document.createElement("canvas");
      c.width=w;
      c.height=h;

      const x=c.getContext("2d");
      x.drawImage(img,0,0,w,h);

      resolve(c.toDataURL("image/jpeg",0.78));
    };

    img.onerror=reject;
    img.src=dataUrl;
  });
}

/*
  Fotoğrafı 64x64 gri görüntüye dönüştürür.
  Görüntünün kenar bölgelerini kırparak
  yazı ve ekran çerçevesinin etkisini azaltır.
*/
function getGrayImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();

    img.onload=()=>{
      ctx.clearRect(0,0,64,64);

      const cropX=img.width*0.08;
      const cropY=img.height*0.12;
      const cropW=img.width*0.84;
      const cropH=img.height*0.76;

      ctx.drawImage(
        img,
        cropX,cropY,cropW,cropH,
        0,0,64,64
      );

      const pixels=
        ctx.getImageData(0,0,64,64).data;

      const gray=new Float32Array(64*64);

      for(let i=0,p=0;i<pixels.length;i+=4,p++){
        gray[p]=
          pixels[i]*0.299+
          pixels[i+1]*0.587+
          pixels[i+2]*0.114;
      }

      resolve(gray);
    };

    img.onerror=reject;
    img.src=src;
  });
}

/*
  Sobel benzeri kenar çıkarımı.
  Mum gövdeleri, fitiller ve grafik çizgileri
  parlaklık/renkten daha önemli hale gelir.
*/
function edgeVector(gray){
  const output=[];

  for(let y=1;y<63;y++){
    for(let x=1;x<63;x++){

      const i=y*64+x;

      const gx=
        -gray[i-65]+gray[i-63]
        -2*gray[i-1]+2*gray[i+1]
        -gray[i+63]+gray[i+65];

      const gy=
        -gray[i-65]-2*gray[i-64]-gray[i-63]
        +gray[i+63]+2*gray[i+64]+gray[i+65];

      const magnitude=Math.sqrt(gx*gx+gy*gy);

      output.push(Math.min(255,magnitude));
    }
  }

  return output;
}

async function imageVector(src){
  const gray=await getGrayImage(src);
  return edgeVector(gray);
}

function similarity(a,b){
  let dot=0;
  let aa=0;
  let bb=0;

  for(let i=0;i<a.length;i++){
    dot+=a[i]*b[i];
    aa+=a[i]*a[i];
    bb+=b[i]*b[i];
  }

  if(aa===0 || bb===0) return 0;

  const cosine=dot/(Math.sqrt(aa)*Math.sqrt(bb));

  return Math.max(0,Math.min(100,cosine*100));
}

referenceInput.addEventListener("change",async function(){
  const files=Array.from(this.files || []);

  for(const file of files){
    try{
      const original=await fileToDataURL(file);
      const small=await resizeImage(original);
      references.push(small);
    }catch(e){}
  }

  saveReferences();
  renderGallery();
  this.value="";
});

clearButton.addEventListener("click",()=>{
  if(confirm("Tüm referans fotoğrafları silinsin mi?")){
    references=[];
    localStorage.removeItem("referencePhotos");

    renderGallery();

    bestImage.style.display="none";
    cameraPreview.removeAttribute("src");
    result.textContent="Fotoğraf bekleniyor…";
  }
});

cameraInput.addEventListener("change",async function(){

  const file=this.files[0];

  if(!file) return;

  if(references.length===0){
    result.textContent=
      "Önce en az bir referans fotoğraf ekle.";
    return;
  }

  result.textContent="🔎 Mum yapısı karşılaştırılıyor…";
  bestImage.style.display="none";

  try{
    const original=await fileToDataURL(file);
    const cameraImage=await resizeImage(original);

    cameraPreview.src=cameraImage;

    const target=await imageVector(cameraImage);

    let bestScore=-1;
    let bestSrc=null;

    for(const ref of references){
      const vector=await imageVector(ref);
      const score=similarity(target,vector);

      if(score>bestScore){
        bestScore=score;
        bestSrc=ref;
      }
    }

    /*
      Düşük benzerlikte yanlış eşleşme göstermiyoruz.
      İlk testlerden sonra eşiği yeniden ayarlayabiliriz.
    */
    const MATCH_THRESHOLD=72;

    if(bestScore>=MATCH_THRESHOLD){
      bestImage.src=bestSrc;
      bestImage.style.display="block";

      result.innerHTML=
        "✅ En yakın formasyon bulundu.<br>"+
        "Şekil benzerliği: %"+
        bestScore.toFixed(1);
    }else{
      bestImage.style.display="none";

      result.innerHTML=
        "❌ Güvenilir eşleşme bulunamadı.<br>"+
        "En yakın sonuç: %"+
        bestScore.toFixed(1);
    }

  }catch(e){
    result.textContent=
      "Karşılaştırma sırasında hata oluştu.";
  }

  this.value="";
});

renderGallery();
</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
