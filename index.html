<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fotoğraf Eşleştir</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;background:#f4f4f6;color:#111;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.container{max-width:720px;margin:auto}
h1{text-align:center;font-size:25px}
.card{
 background:#fff;border-radius:18px;padding:16px;margin-bottom:18px;
 box-shadow:0 2px 12px rgba(0,0,0,.08)
}
button{
 width:100%;border:0;border-radius:13px;padding:15px;margin:6px 0;
 font-size:17px;font-weight:700
}
.blue{background:#087cff;color:#fff}
.red{background:#ff3b30;color:#fff}
#refs{
 display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0
}
.ref{background:#f6f6f7;border-radius:10px;padding:5px;text-align:center}
.ref img{
 width:100%;height:90px;object-fit:contain;background:#fff;border-radius:7px
}
.refName{
 font-size:11px;font-weight:700;margin-top:4px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.small{text-align:center;color:#666;font-size:13px;line-height:1.5}
#status{text-align:center;font-weight:700;line-height:1.5;margin:12px 0}
#resultCanvas{
 display:none;width:100%;height:auto;border-radius:12px;margin-top:12px
}
#answer{
 display:none;text-align:center;background:#f0fff4;border:2px solid #20a856;
 border-radius:14px;padding:14px;margin-top:14px
}
#answerName{font-size:25px;font-weight:900}
#answerScore{font-size:34px;font-weight:900;color:#159447}
.badge{
 display:inline-block;padding:7px 11px;border-radius:20px;
 background:#e8f7ed;color:#13773a;font-size:13px;font-weight:700;margin:4px
}
.match{
 display:flex;align-items:center;gap:10px;background:#f7f7f8;
 padding:8px;border-radius:11px;margin:7px 0
}
.match img{
 width:62px;height:55px;object-fit:contain;background:#fff;border-radius:7px
}
.matchText{flex:1;font-size:14px}
.bar{height:6px;background:#ddd;border-radius:8px;overflow:hidden;margin-top:5px}
.fill{height:100%;background:#087cff}
</style>
</head>

<body>
<div class="container">

<h1>🔍 Fotoğraf Eşleştir — AI Lens</h1>

<div class="card">
<h2>Formasyon Kütüphanesi</h2>

<button class="blue" onclick="refInput.click()">➕ Formasyon Ekle</button>
<input id="refInput" type="file" accept="image/*" multiple hidden>

<div id="refs"></div>

<button class="red" onclick="clearRefs()">Tüm Formasyonları Sil</button>
<div id="count" class="small"></div>
</div>

<div class="card">
<h2>Grafiği Tara</h2>

<button class="blue" onclick="cameraInput.click()">📷 Kamerayla Grafik Çek</button>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>

<div id="status"></div>

<canvas id="resultCanvas"></canvas>

<div id="answer">
 <div>🎯 Eşleşen Formasyon</div>
 <div id="answerName"></div>
 <div id="answerScore"></div>
 <div id="answerInfo"></div>
</div>

<div id="topMatches"></div>
</div>

</div>

<script>
const $=id=>document.getElementById(id);

const refInput=$("refInput");
const cameraInput=$("cameraInput");
const refsDiv=$("refs");
const countDiv=$("count");
const statusDiv=$("status");
const canvas=$("resultCanvas");
const answer=$("answer");
const answerName=$("answerName");
const answerScore=$("answerScore");
const answerInfo=$("answerInfo");
const topMatches=$("topMatches");

let references=[];

/* =========================
   KÜTÜPHANE
========================= */

try{
 const old=JSON.parse(localStorage.getItem("chartReferences")||"[]");

 references=old.map((r,i)=>{
  if(typeof r==="string"){
   return{name:"Formasyon "+(i+1),src:r};
  }

  return{
   name:r.name||("Formasyon "+(i+1)),
   src:r.src||r.data||r.image||""
  };
 }).filter(r=>r.src);

}catch(e){
 references=[];
}

renderRefs();

function saveRefs(){
 localStorage.setItem("chartReferences",JSON.stringify(references));
}

function renderRefs(){
 refsDiv.innerHTML="";

 references.forEach((r,i)=>{
  const box=document.createElement("div");
  box.className="ref";

  const img=document.createElement("img");
  img.src=r.src;

  const n=document.createElement("div");
  n.className="refName";
  n.textContent=r.name;

  box.append(img,n);

  box.onclick=()=>{
   const name=prompt("Formasyon adı:",r.name);
   if(name&&name.trim()){
    references[i].name=name.trim();
    saveRefs();
    renderRefs();
   }
  };

  refsDiv.appendChild(box);
 });

 countDiv.textContent=references.length+" formasyon kayıtlı";
}

function clearRefs(){
 if(!confirm("Tüm formasyonlar silinsin mi?"))return;
 references=[];
 saveRefs();
 renderRefs();
}

refInput.onchange=async e=>{
 for(const file of [...e.target.files]){
  const src=await fileURL(file);

  let name=file.name.replace(/\.[^/.]+$/,"").trim();
  if(!name)name="Formasyon "+(references.length+1);

  references.push({name,src});
 }

 saveRefs();
 renderRefs();
 refInput.value="";
};

/* =========================
   KAMERA
========================= */

cameraInput.onchange=async e=>{
 const file=e.target.files[0];
 if(!file)return;

 if(!references.length){
  alert("Önce en az bir formasyon ekleyin.");
  cameraInput.value="";
  return;
 }

 reset();

 try{
  statusDiv.textContent="🔍 Grafik AI Lens ile taranıyor...";

  const img=await loadImg(await fileURL(file));

  /*
    Grafiğin ana bölgesini kullan.
    Üst menü ve alt hacim alanını azaltır.
  */
  const chart={
   x:Math.round(img.width*.04),
   y:Math.round(img.height*.16),
   w:Math.round(img.width*.92),
   h:Math.round(img.height*.68)
  };

  const results=[];

  for(let i=0;i<references.length;i++){

   statusDiv.innerHTML=
    "🔍 Son grafik bölgesi taranıyor...<br>"+
    (i+1)+" / "+references.length;

   const refImg=await loadImg(references[i].src);

   const match=scanForReference(img,chart,refImg);

   if(match){
    results.push({
     ...match,
     name:references[i].name,
     src:references[i].src
    });
   }

   await sleep(10);
  }

  results.sort((a,b)=>b.score-a.score);

  if(!results.length){
   drawPlain(img);
   noMatch("Geçerli bir görsel eşleşme bulunamadı.");
   cameraInput.value="";
   return;
  }

  const best=results[0];

  /*
    Çok zayıf eşleşmeyi sonuç diye göstermiyoruz.
  */
  if(best.score<48){
   drawPlain(img);
   noMatch("Son mumlarda yeterince güçlü bir formasyon bulunamadı.");
   showCandidates(results);
   cameraInput.value="";
   return;
  }

  drawMatch(img,best);
  showBest(best);
  showCandidates(results);

 }catch(err){
  console.error(err);
  noMatch("Grafik analiz edilirken hata oluştu.");
 }

 cameraInput.value="";
};

/* =====================================================
   LENS TARAMASI

   Referans görüntüyü küçük bir renk/şekil imzasına
   çeviriyoruz.

   Kamera grafiğinin özellikle SAĞ bölümünde farklı
   pencere boyutları taranıyor.
===================================================== */

function scanForReference(img,chart,refImg){

 const refSig=makeSignature(refImg);

 if(!refSig)return null;

 let best=null;

 /*
   Son mumları yakalamak için grafiğin
   sağ %58'lik bölümüne odaklanıyoruz.
 */
 const searchLeft=chart.x+chart.w*.42;
 const searchRight=chart.x+chart.w;

 /*
   Farklı büyüklükte formasyon pencereleri.
 */
 const widths=[
  chart.w*.18,
  chart.w*.23,
  chart.w*.28,
  chart.w*.34,
  chart.w*.40
 ];

 for(const ww0 of widths){

  const ww=Math.round(ww0);

  /*
    Referans oranına göre pencere yüksekliği,
    fakat grafik için makul sınırda.
  */
  let hh=Math.round(
   ww*(refImg.height/refImg.width)
  );

  hh=Math.max(
   Math.round(chart.h*.20),
   Math.min(
    Math.round(chart.h*.72),
    hh
   )
  );

  const xStep=Math.max(8,Math.round(ww*.10));
  const yStep=Math.max(8,Math.round(hh*.10));

  /*
    Sağdan sola tarıyoruz.
    Böylece eşit skorda en yeni bölge kazanır.
  */
  for(
   let x=Math.round(searchRight-ww);
   x>=searchLeft;
   x-=xStep
  ){

   for(
    let y=chart.y;
    y<=chart.y+chart.h-hh;
    y+=yStep
   ){

    const sig=signatureFromRegion(img,x,y,ww,hh);

    if(!sig)continue;

    const similarity=compareSignatures(refSig,sig);

    /*
      Sağ uca yakınlık bonusu.
    */
    const rightEdge=x+ww;

    const distance=
     Math.max(
      0,
      searchRight-rightEdge
     );

    const rightFactor=
     1-Math.min(
      1,
      distance/(chart.w*.55)
     );

    /*
      Renkli mum yoğunluğu bonusu.
      Boş grafik alanlarının kazanmasını engeller.
    */
    const densityBonus=
     Math.min(
      7,
      sig.density*24
     );

    let score=
     similarity*.90+
     rightFactor*7+
     densityBonus;

    score=Math.max(0,Math.min(99,score));

    if(!best||score>best.score){
     best={
      score,
      x,y,w:ww,h:hh,
      rightFactor
     };
    }
   }
  }
 }

 return best;
}

/* =========================
   REFERANS İMZASI
========================= */

function makeSignature(img){
 return signatureFromRegion(
  img,
  0,0,
  img.width,
  img.height
 );
}

/*
  Görüntüyü 18 x 18 küçük hücreye indiriyoruz.

  Her hücrede:
  0 = boş / arka plan
  1 = kırmızı mum
  2 = yeşil mum
  3 = koyu şekil

  MA çizgileri gibi sarı/mor renkler büyük ölçüde yok sayılır.
*/
function signatureFromRegion(img,x,y,w,h){

 const GW=18;
 const GH=18;

 const work=document.createElement("canvas");
 work.width=GW;
 work.height=GH;

 const ctx=work.getContext("2d",{willReadFrequently:true});

 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,GW,GH);

 ctx.drawImage(
  img,
  x,y,w,h,
  0,0,GW,GH
 );

 const d=ctx.getImageData(0,0,GW,GH).data;

 const cells=[];
 let colored=0;

 for(let i=0;i<GW*GH;i++){

  const r=d[i*4];
  const g=d[i*4+1];
  const b=d[i*4+2];

  const type=pixelType(r,g,b);

  cells.push(type);

  if(type===1||type===2){
   colored++;
  }
 }

 /*
   Tamamen boş bölgeyi aday yapma.
 */
 const density=colored/(GW*GH);

 if(density<.012){
  return null;
 }

 /*
   Her sütundaki kırmızı/yeşil dağılımı.
   Mumların soldan sağa yapısını korur.
 */
 const columns=[];

 for(let xx=0;xx<GW;xx++){

  let red=0;
  let green=0;
  let dark=0;
  let sumY=0;
  let count=0;

  for(let yy=0;yy<GH;yy++){

   const v=cells[yy*GW+xx];

   if(v===1){
    red++;
    sumY+=yy;
    count++;
   }

   if(v===2){
    green++;
    sumY+=yy;
    count++;
   }

   if(v===3){
    dark++;
   }
  }

  columns.push({
   red:red/GH,
   green:green/GH,
   dark:dark/GH,
   center:count ? (sumY/count)/(GH-1) : -1
  });
 }

 return{
  cells,
  columns,
  density,
  GW,
  GH
 };
}

/* =========================
   RENK SINIFLANDIRMA
========================= */

function pixelType(r,g,b){

 const hsv=rgbHSV(r,g,b);

 /*
   Kırmızı mum.
 */
 if(
  hsv.s>.24 &&
  hsv.v>.28 &&
  (
   hsv.h<=22 ||
   hsv.h>=337
  ) &&
  r>g+15
 ){
  return 1;
 }

 /*
   Yeşil / turkuaz mum.
 */
 if(
  hsv.s>.22 &&
  hsv.v>.25 &&
  hsv.h>=125 &&
  hsv.h<=185 &&
  g>r+14
 ){
  return 2;
 }

 /*
   Siyah/koyu mum kenarı veya fitil.
   Çok az ağırlıkla kullanılır.
 */
 if(
  r<90 &&
  g<90 &&
  b<90
 ){
  return 3;
 }

 return 0;
}

function rgbHSV(r,g,b){

 r/=255;
 g/=255;
 b/=255;

 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);
 const d=max-min;

 let h=0;

 if(d){
  if(max===r){
   h=60*(((g-b)/d)%6);
  }else if(max===g){
   h=60*((b-r)/d+2);
  }else{
   h=60*((r-g)/d+4);
  }
 }

 if(h<0)h+=360;

 return{
  h,
  s:max===0?0:d/max,
  v:max
 };
}

/* =========================
   İMZA KARŞILAŞTIRMA
========================= */

function compareSignatures(a,b){

 if(!a||!b)return 0;

 let cellScore=0;
 let cellWeight=0;

 /*
   Kırmızı / yeşil hücrelerin
   konum benzerliği.
 */
 for(let i=0;i<a.cells.length;i++){

  const A=a.cells[i];
  const B=b.cells[i];

  if(A===0&&B===0)continue;

  let weight=1;

  if(A===1||A===2){
   weight=2.2;
  }

  if(B===1||B===2){
   weight=Math.max(weight,2.2);
  }

  cellWeight+=weight;

  if(A===B){
   cellScore+=weight;
  }else if(
   (A===1||A===2) &&
   (B===1||B===2)
  ){
   /*
     Mum var ama rengi ters.
   */
   cellScore+=weight*.18;
  }
 }

 const spatial=
  cellWeight ?
  cellScore/cellWeight :
  0;

 /*
   Soldan sağa renk ve yükseklik yapısı.
 */
 let columnScore=0;
 let used=0;

 for(let i=0;i<a.columns.length;i++){

  const A=a.columns[i];
  const B=b.columns[i];

  const aAmount=A.red+A.green;
  const bAmount=B.red+B.green;

  if(
   aAmount<.01 &&
   bAmount<.01
  ){
   continue;
  }

  const amountSim=
   1-Math.min(
    1,
    Math.abs(aAmount-bAmount)/.35
   );

  const redSim=
   1-Math.min(
    1,
    Math.abs(A.red-B.red)/.28
   );

  const greenSim=
   1-Math.min(
    1,
    Math.abs(A.green-B.green)/.28
   );

  let centerSim=.5;

  if(
   A.center>=0 &&
   B.center>=0
  ){
   centerSim=
    1-Math.min(
     1,
     Math.abs(A.center-B.center)/.42
    );
  }

  columnScore+=
   amountSim*.25+
   redSim*.25+
   greenSim*.25+
   centerSim*.25;

  used++;
 }

 const structure=
  used ?
  columnScore/used :
  0;

 /*
   Toplam kırmızı/yeşil yoğunluk.
 */
 const densitySim=
  1-Math.min(
   1,
   Math.abs(a.density-b.density)/.22
  );

 /*
   Son skor.
 */
 return(
  spatial*.46+
  structure*.44+
  densitySim*.10
 )*100;
}

/* =========================
   YEŞİL KUTU
========================= */

function drawMatch(img,best){

 canvas.width=img.width;
 canvas.height=img.height;

 const ctx=canvas.getContext("2d");

 ctx.drawImage(img,0,0);

 let x=best.x;
 let y=best.y;
 let w=best.w;
 let h=best.h;

 const px=Math.max(8,w*.04);
 const py=Math.max(8,h*.04);

 x=Math.max(3,x-px);
 y=Math.max(3,y-py);

 w=Math.min(
  img.width-x-3,
  w+px*2
 );

 h=Math.min(
  img.height-y-3,
  h+py*2
 );

 ctx.strokeStyle="#18b65b";
 ctx.lineWidth=Math.max(5,img.width*.006);

 ctx.strokeRect(x,y,w,h);

 const text=
  best.name+
  " %"+
  Math.round(best.score);

 const fs=Math.max(24,img.width*.035);

 ctx.font=
  "bold "+fs+
  "px -apple-system,Arial";

 const tw=ctx.measureText(text).width;

 const lh=fs*1.5;

 let ly=y-lh;

 if(ly<0){
  ly=y;
 }

 ctx.fillStyle="#18b65b";

 ctx.fillRect(
  x,
  ly,
  tw+24,
  lh
 );

 ctx.fillStyle="#fff";

 ctx.fillText(
  text,
  x+12,
  ly+fs*1.1
 );

 canvas.style.display="block";
}

function drawPlain(img){

 canvas.width=img.width;
 canvas.height=img.height;

 canvas
  .getContext("2d")
  .drawImage(img,0,0);

 canvas.style.display="block";
}

/* =========================
   SONUÇ
========================= */

function showBest(best){

 answer.style.display="block";

 answerName.textContent=best.name;

 answerScore.textContent=
  "%"+Math.round(best.score);

 let rightText="Son bölge";

 if(best.rightFactor>.80){
  rightText="En son mumlara çok yakın";
 }else if(best.rightFactor>.55){
  rightText="Son mumlar bölgesi";
 }

 answerInfo.innerHTML=
  '<span class="badge">'+
  rightText+
  '</span>'+
  '<div class="small" style="margin-top:8px">'+
  'AI Lens görsel eşleştirme'+
  '</div>';

 statusDiv.innerHTML=
  "✅ Formasyon bulundu";
}

function showCandidates(results){

 topMatches.innerHTML="";

 if(!results.length)return;

 const h=document.createElement("h3");
 h.textContent="En yakın eşleşmeler";

 topMatches.appendChild(h);

 results.slice(0,3).forEach((m,i)=>{

  const row=document.createElement("div");
  row.className="match";

  const im=document.createElement("img");
  im.src=m.src;

  const text=document.createElement("div");
  text.className="matchText";

  text.innerHTML=
   "<b>"+
   (i+1)+
   ". "+
   esc(m.name)+
   "</b><br>%"+
   Math.round(m.score)+
   '<div class="bar">'+
   '<div class="fill" style="width:'+
   Math.max(0,Math.min(100,m.score))+
   '%"></div></div>';

  row.append(im,text);

  topMatches.appendChild(row);
 });
}

function noMatch(text){

 answer.style.display="none";

 statusDiv.innerHTML=
  "⚠️ Formasyon bulunamadı"+
  "<br>"+
  "<span style='font-weight:400'>"+
  text+
  "</span>";
}

function reset(){

 answer.style.display="none";
 canvas.style.display="none";
 topMatches.innerHTML="";
 statusDiv.textContent="";
}

/* =========================
   YARDIMCILAR
========================= */

function fileURL(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=
   ()=>resolve(reader.result);

  reader.onerror=reject;

  reader.readAsDataURL(file);
 });
}

function loadImg(src){

 return new Promise((resolve,reject)=>{

  const img=new Image();

  img.onload=
   ()=>resolve(img);

  img.onerror=reject;

  img.src=src;
 });
}

function sleep(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

function esc(s){

 return String(s)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");
}
</script>

</body>
</html>
