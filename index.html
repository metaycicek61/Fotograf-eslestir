<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fotoğraf Eşleştir</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  padding:20px;
  background:#f4f4f6;
  color:#111;
}
.container{
  max-width:650px;
  margin:auto;
}
h1{
  text-align:center;
  font-size:28px;
}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin:6px 0;
  font-size:17px;
  font-weight:600;
}
.blue{
  background:#087cff;
  color:white;
}
.red{
  background:#ff3b30;
  color:white;
}
#refs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}
#refs img{
  width:100%;
  height:105px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}
.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:10px;
  margin-top:10px;
}
.result{
  text-align:center;
  font-size:19px;
  font-weight:700;
  margin-top:14px;
}
.small{
  text-align:center;
  color:#666;
  font-size:14px;
}
canvas{display:none}
</style>
</head>

<body>
<div class="container">

<h1>📷 Fotoğraf Eşleştir</h1>

<div class="card">
<h2>Referans Fotoğraflar</h2>

<button class="blue" onclick="refInput.click()">➕ Fotoğraf Ekle</button>

<input id="refInput"
       type="file"
       accept="image/*"
       multiple
       hidden>

<div id="refs"></div>

<button class="red" onclick="clearRefs()">Tüm Referansları Sil</button>

<div id="count" class="small">0 fotoğraf kayıtlı</div>
</div>

<div class="card">
<h2>Karşılaştır</h2>

<button class="blue" onclick="cameraInput.click()">📷 Kamerayla Fotoğraf Çek</button>

<input id="cameraInput"
       type="file"
       accept="image/*"
       capture="environment"
       hidden>

<img id="queryPreview" class="preview" style="display:none">

<div id="status" class="result"></div>

<img id="matchPreview" class="preview" style="display:none">
</div>

<canvas id="canvas"></canvas>

</div>

<script>
const refInput = document.getElementById("refInput");
const cameraInput = document.getElementById("cameraInput");
const refsDiv = document.getElementById("refs");
const countDiv = document.getElementById("count");
const queryPreview = document.getElementById("queryPreview");
const matchPreview = document.getElementById("matchPreview");
const statusDiv = document.getElementById("status");

let references = [];

try{
  references = JSON.parse(localStorage.getItem("chartReferences") || "[]");
}catch(e){
  references = [];
}

renderRefs();

refInput.addEventListener("change", async e => {
  const files = [...e.target.files];

  for(const file of files){
    const data = await fileToDataURL(file);
    references.push(data);
  }

  saveRefs();
  renderRefs();
  refInput.value="";
});

cameraInput.addEventListener("change", async e => {
  const file = e.target.files[0];
  if(!file) return;

  if(references.length === 0){
    alert("Önce en az bir referans fotoğraf ekleyin.");
    return;
  }

  const query = await fileToDataURL(file);

  queryPreview.src = query;
  queryPreview.style.display = "block";

  statusDiv.textContent = "Grafik analiz ediliyor...";
  matchPreview.style.display = "none";

  await new Promise(r => setTimeout(r,100));

  let bestScore = -1;
  let bestRef = null;

  const queryFeatures = await extractChartFeatures(query);

  for(const ref of references){
    const refFeatures = await extractChartFeatures(ref);
    const score = compareFeatures(queryFeatures, refFeatures);

    if(score > bestScore){
      bestScore = score;
      bestRef = ref;
    }
  }

  const percent = Math.max(0, Math.min(100, bestScore * 100));

  /*
    Artık uygulama her durumda bir eşleşmeyi zorlamıyor.
    Güven düşükse "eşleşme yok" diyor.
  */
  if(percent < 68){
    statusDiv.innerHTML =
      "❌ Yeterli eşleşme bulunamadı.<br>" +
      "En yakın benzerlik: %" + percent.toFixed(1);

    matchPreview.style.display = "none";
  }else{
    statusDiv.innerHTML =
      "✅ En yakın formasyon bulundu.<br>" +
      "Benzerlik: %" + percent.toFixed(1);

    matchPreview.src = bestRef;
    matchPreview.style.display = "block";
  }

  cameraInput.value="";
});

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function saveRefs(){
  try{
    localStorage.setItem("chartReferences", JSON.stringify(references));
  }catch(e){
    alert("Telefon hafızasında yeterli alan olmayabilir.");
  }
}

function renderRefs(){
  refsDiv.innerHTML="";

  references.forEach((src,index)=>{
    const img=document.createElement("img");
    img.src=src;

    img.onclick=()=>{
      if(confirm("Bu referans fotoğraf silinsin mi?")){
        references.splice(index,1);
        saveRefs();
        renderRefs();
      }
    };

    refsDiv.appendChild(img);
  });

  countDiv.textContent =
    references.length + " fotoğraf kayıtlı";
}

function clearRefs(){
  if(!references.length) return;

  if(confirm("Tüm referans fotoğraflar silinsin mi?")){
    references=[];
    saveRefs();
    renderRefs();
    statusDiv.textContent="";
    matchPreview.style.display="none";
  }
}

/*
  FOTOĞRAFI GRAFİK VERİSİNE DÖNÜŞTÜR

  Kenarlardaki yazı ve uygulama arayüzünü azaltmak için
  görüntünün merkez bölümü kullanılıyor.

  Renk yerine:
  - parlaklık
  - dikey değişimler
  - yatay değişimler
  - mum benzeri kenarlar
  karşılaştırılıyor.
*/
async function extractChartFeatures(src){

  const img = await loadImage(src);

  const SIZE = 72;

  const canvas = document.createElement("canvas");
  canvas.width = SIZE;
  canvas.height = SIZE;

  const ctx = canvas.getContext("2d",{
    willReadFrequently:true
  });

  /*
    Üst-alt ve kenar bölgelerini kırp.
    Böylece fiyat yazıları, saatler ve menüler
    karşılaştırmayı daha az etkiler.
  */
  const sx = img.width * 0.07;
  const sy = img.height * 0.12;
  const sw = img.width * 0.86;
  const sh = img.height * 0.72;

  ctx.drawImage(
    img,
    sx,sy,sw,sh,
    0,0,SIZE,SIZE
  );

  const data =
    ctx.getImageData(0,0,SIZE,SIZE).data;

  const gray = new Float32Array(SIZE*SIZE);

  for(let i=0;i<SIZE*SIZE;i++){
    const r=data[i*4];
    const g=data[i*4+1];
    const b=data[i*4+2];

    gray[i] =
      (0.299*r + 0.587*g + 0.114*b)/255;
  }

  /*
    Ortalama parlaklığı çıkar.
    Beyaz veya koyu zemin farkının etkisini azaltır.
  */
  let mean=0;

  for(const v of gray) mean+=v;
  mean/=gray.length;

  for(let i=0;i<gray.length;i++){
    gray[i]-=mean;
  }

  const edges = new Float32Array(SIZE*SIZE);

  let edgeMean=0;

  /*
    Basit Sobel benzeri kenar analizi.
    Mumların gövdeleri ve fitilleri burada öne çıkar.
  */
  for(let y=1;y<SIZE-1;y++){
    for(let x=1;x<SIZE-1;x++){

      const i=y*SIZE+x;

      const gx =
        gray[i+1] -
        gray[i-1];

      const gy =
        gray[i+SIZE] -
        gray[i-SIZE];

      let magnitude =
        Math.sqrt(gx*gx + gy*gy);

      edges[i]=magnitude;
      edgeMean+=magnitude;
    }
  }

  edgeMean /= (SIZE-2)*(SIZE-2);

  /*
    Çok zayıf kenarları temizle.
    Küçük yazılar ve gürültüler azalır.
  */
  const threshold=edgeMean*1.15;

  for(let i=0;i<edges.length;i++){
    if(edges[i]<threshold){
      edges[i]=0;
    }
  }

  /*
    Grafiği 12x12 bölgelere indiriyoruz.
    Bu, küçük kamera açısı ve ölçek farklarına
    tolerans sağlar.
  */
  const GRID=12;
  const block=SIZE/GRID;

  const grid=[];

  for(let gy=0;gy<GRID;gy++){
    for(let gx=0;gx<GRID;gx++){

      let sum=0;

      for(let y=0;y<block;y++){
        for(let x=0;x<block;x++){

          const px =
            Math.floor(gx*block+x);

          const py =
            Math.floor(gy*block+y);

          sum += edges[py*SIZE+px];
        }
      }

      grid.push(sum/(block*block));
    }
  }

  /*
    Dikey profil:
    mumların soldan sağa dağılımını yakalar.
  */
  const vertical=[];

  for(let x=0;x<SIZE;x++){
    let sum=0;

    for(let y=0;y<SIZE;y++){
      sum+=edges[y*SIZE+x];
    }

    vertical.push(sum/SIZE);
  }

  /*
    Yatay profil:
    fiyat hareketinin yükseklik dağılımını yakalar.
  */
  const horizontal=[];

  for(let y=0;y<SIZE;y++){
    let sum=0;

    for(let x=0;x<SIZE;x++){
      sum+=edges[y*SIZE+x];
    }

    horizontal.push(sum/SIZE);
  }

  return {
    grid:normalize(grid),
    vertical:normalize(vertical),
    horizontal:normalize(horizontal)
  };
}

function normalize(arr){

  let mean =
    arr.reduce((a,b)=>a+b,0)/arr.length;

  let out =
    arr.map(v=>v-mean);

  let norm =
    Math.sqrt(
      out.reduce((a,b)=>a+b*b,0)
    );

  if(norm===0) norm=1;

  return out.map(v=>v/norm);
}

function cosine(a,b){

  let sum=0;

  for(let i=0;i<a.length;i++){
    sum+=a[i]*b[i];
  }

  /*
    cosine yaklaşık -1..1.
    0..1 aralığına dönüştür.
  */
  return (sum+1)/2;
}

function compareFeatures(a,b){

  const gridScore =
    cosine(a.grid,b.grid);

  const verticalScore =
    cosine(a.vertical,b.vertical);

  const horizontalScore =
    cosine(a.horizontal,b.horizontal);

  /*
    Mum/grafik yapısına en fazla ağırlık.
  */
  return (
    gridScore*0.60 +
    verticalScore*0.25 +
    horizontalScore*0.15
  );
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}

/*
  Eski service worker varsa kayıt devam etsin.
*/
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker
      .register("./service-worker.js")
      .catch(()=>{});
  });
}
</script>

</body>
</html>
