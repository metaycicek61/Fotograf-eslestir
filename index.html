<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fotoğraf Eşleştir AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:#f4f4f6;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{max-width:720px;margin:auto}
h1{text-align:center;font-size:24px}
h2{font-size:20px}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin:6px 0;
  font-size:17px;
  font-weight:700;
}

.blue{background:#087cff;color:#fff}
.red{background:#ff3b30;color:#fff}

#refs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}

.ref{
  background:#f6f6f7;
  border-radius:10px;
  padding:5px;
  text-align:center;
}

.ref img{
  width:100%;
  height:90px;
  object-fit:contain;
  background:#fff;
  border-radius:7px;
}

.refName{
  font-size:11px;
  font-weight:700;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.small{
  text-align:center;
  color:#666;
  font-size:13px;
  line-height:1.5;
}

#status{
  text-align:center;
  font-weight:700;
  line-height:1.6;
  margin:12px 0;
}

#resultCanvas{
  display:none;
  width:100%;
  height:auto;
  border-radius:12px;
  margin-top:12px;
}

#answer{
  display:none;
  text-align:center;
  background:#f0fff4;
  border:2px solid #20a856;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
}

#answerName{
  font-size:25px;
  font-weight:900;
}

#answerScore{
  font-size:34px;
  font-weight:900;
  color:#159447;
}

.badge{
  display:inline-block;
  padding:7px 11px;
  border-radius:20px;
  background:#e8f7ed;
  color:#13773a;
  font-size:13px;
  font-weight:700;
  margin:4px;
}

.match{
  display:flex;
  align-items:center;
  gap:10px;
  background:#f7f7f8;
  padding:8px;
  border-radius:11px;
  margin:7px 0;
}

.match img{
  width:62px;
  height:55px;
  object-fit:contain;
  background:#fff;
  border-radius:7px;
}

.matchText{
  flex:1;
  font-size:14px;
}

.bar{
  height:6px;
  background:#ddd;
  border-radius:8px;
  overflow:hidden;
  margin-top:5px;
}

.fill{
  height:100%;
  background:#087cff;
}

.modelNote{
  background:#eef6ff;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  text-align:center;
  color:#345;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🧠 Fotoğraf Eşleştir — AI</h1>

<div class="card">

<h2>Formasyon Kütüphanesi</h2>

<button class="blue" onclick="refInput.click()">
➕ Formasyon Ekle
</button>

<input id="refInput"
       type="file"
       accept="image/*"
       multiple
       hidden>

<div id="refs"></div>

<button class="red" onclick="clearRefs()">
Tüm Formasyonları Sil
</button>

<div id="count" class="small"></div>

</div>


<div class="card">

<h2>Grafiği AI ile Tara</h2>

<button class="blue" onclick="cameraInput.click()">
📷 Kamerayla Grafik Çek
</button>

<input id="cameraInput"
       type="file"
       accept="image/*"
       capture="environment"
       hidden>

<div id="status">
İlk taramada AI modeli yüklenecek.
</div>

<div class="modelNote">
AI özellikle grafiğin sağ tarafındaki son mumlarda eşleşme arar.
</div>

<canvas id="resultCanvas"></canvas>

<div id="answer">
  <div>🎯 Eşleşen Formasyon</div>
  <div id="answerName"></div>
  <div id="answerScore"></div>
  <div id="answerInfo"></div>
</div>

<div id="topMatches"></div>

</div>

</div>


<script type="module">

import {
  pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


const $ = id => document.getElementById(id);

const refInput = $("refInput");
const cameraInput = $("cameraInput");
const refsDiv = $("refs");
const countDiv = $("count");
const statusDiv = $("status");
const canvas = $("resultCanvas");

const answer = $("answer");
const answerName = $("answerName");
const answerScore = $("answerScore");
const answerInfo = $("answerInfo");
const topMatches = $("topMatches");


/* ================================
   TELEFONDAKİ MEVCUT KÜTÜPHANE
================================ */

let references = [];

try {

  const old =
    JSON.parse(
      localStorage.getItem("chartReferences") || "[]"
    );

  references = old.map((r,i)=>{

    if(typeof r === "string"){
      return {
        name:"Formasyon "+(i+1),
        src:r
      };
    }

    return {
      name:r.name || ("Formasyon "+(i+1)),
      src:r.src || r.data || r.image || ""
    };

  }).filter(r=>r.src);

}catch(e){

  references=[];

}

renderRefs();


function saveRefs(){

  localStorage.setItem(
    "chartReferences",
    JSON.stringify(references)
  );

}


function renderRefs(){

  refsDiv.innerHTML="";

  references.forEach((r,i)=>{

    const box=document.createElement("div");
    box.className="ref";

    const img=document.createElement("img");
    img.src=r.src;

    const name=document.createElement("div");
    name.className="refName";
    name.textContent=r.name;

    box.append(img,name);

    box.onclick=()=>{

      const n=prompt(
        "Formasyon adı:",
        r.name
      );

      if(n && n.trim()){

        references[i].name=n.trim();

        saveRefs();
        renderRefs();

      }

    };

    refsDiv.appendChild(box);

  });

  countDiv.textContent =
    references.length+" formasyon kayıtlı";

}


window.clearRefs=function(){

  if(!confirm(
    "Tüm formasyonlar silinsin mi?"
  )) return;

  references=[];

  saveRefs();
  renderRefs();

};


refInput.onchange=async e=>{

  for(const file of [...e.target.files]){

    const src=await fileURL(file);

    let name=
      file.name
      .replace(/\.[^/.]+$/,"")
      .trim();

    if(!name){
      name="Formasyon "+(references.length+1);
    }

    references.push({
      name,
      src
    });

  }

  saveRefs();
  renderRefs();

  refInput.value="";

};


/* ================================
   AI MODEL
================================ */

let extractor=null;
let modelLoading=false;


async function getAI(){

  if(extractor) return extractor;

  if(modelLoading){

    while(modelLoading){
      await sleep(300);
    }

    return extractor;

  }

  modelLoading=true;

  try{

    statusDiv.innerHTML=
      "🧠 AI modeli hazırlanıyor...<br>"+
      "İlk kullanım biraz sürebilir.";

    extractor=await pipeline(
      "image-feature-extraction",
      "Xenova/clip-vit-base-patch32",
      {
        progress_callback:(p)=>{

          if(
            p &&
            typeof p.progress==="number"
          ){

            statusDiv.innerHTML=
              "🧠 AI modeli yükleniyor...<br>"+
              "%"+Math.round(p.progress);

          }

        }
      }
    );

    statusDiv.textContent=
      "✅ AI hazır — grafiği tarayabilirsiniz.";

    return extractor;

  }catch(err){

    console.error(err);

    extractor=null;

    throw new Error(
      "AI modeli yüklenemedi. İnternet bağlantısını kontrol edin."
    );

  }finally{

    modelLoading=false;

  }

}


/* ================================
   KAMERA
================================ */

cameraInput.onchange=async e=>{

  const file=e.target.files[0];

  if(!file) return;

  if(!references.length){

    alert(
      "Telefonda kayıtlı formasyon bulunamadı."
    );

    cameraInput.value="";
    return;

  }

  reset();

  try{

    statusDiv.textContent=
      "📷 Grafik hazırlanıyor...";

    const photoSrc=await fileURL(file);
    const img=await loadImg(photoSrc);

    /*
      Binance ekranındaki yaklaşık ana grafik.
      Üst menüler ve alt hacim mümkün olduğunca
      dışarıda bırakılır.
    */

    const chart={
      x:Math.round(img.width*.04),
      y:Math.round(img.height*.17),
      w:Math.round(img.width*.92),
      h:Math.round(img.height*.61)
    };


    const AI=await getAI();


    /* ==========================
       REFERANS EMBEDDINGLERİ
    ========================== */

    statusDiv.textContent=
      "🧠 Formasyonlar AI tarafından okunuyor...";


    const refCanvases=[];

    for(const ref of references){

      const refImg=await loadImg(ref.src);

      refCanvases.push(
        imageToCanvas(refImg)
      );

    }


    const refTensor=
      await AI(refCanvases);


    const refVectors=
      tensorToVectors(
        refTensor,
        references.length
      );


    /* ==========================
       ADAY BÖLGELER
    ========================== */

    statusDiv.innerHTML=
      "🔍 Son mumlar taranıyor...<br>"+
      "Lütfen bekleyin.";


    const candidates=
      buildCandidates(
        img,
        chart,
        references
      );


    if(!candidates.length){

      drawPlain(img);

      noMatch(
        "Taranacak grafik bölgesi oluşturulamadı."
      );

      cameraInput.value="";
      return;

    }


    /*
      Tüm adayları mümkün olduğunca
      tek AI grubunda analiz ediyoruz.
      Böylece telefonda daha hızlıdır.
    */

    const candidateCanvases=
      candidates.map(c=>c.canvas);


    const candidateTensor=
      await AI(candidateCanvases);


    const candidateVectors=
      tensorToVectors(
        candidateTensor,
        candidates.length
      );


    /* ==========================
       KARŞILAŞTIRMA
    ========================== */

    const results=[];


    for(let i=0;i<candidates.length;i++){

      const candidate=candidates[i];

      const vector=candidateVectors[i];

      const refVector=
        refVectors[candidate.refIndex];

      const cosine=
        cosineSimilarity(
          vector,
          refVector
        );


      /*
        CLIP cosine değeri bir olasılık değildir.

        Burada kullanıcıya anlaşılır bir
        BENZERLİK PUANI göstermek için
        0-100 aralığına çeviriyoruz.
      */

      let score=
        ((cosine-.48)/.38)*100;


      /*
        Sağdaki yeni mumlara küçük öncelik.
      */

      score += candidate.rightBonus;


      score=
        Math.max(
          0,
          Math.min(99,score)
        );


      results.push({

        ...candidate,

        score,

        cosine,

        name:
          references[candidate.refIndex].name,

        src:
          references[candidate.refIndex].src

      });

    }


    results.sort(
      (a,b)=>b.score-a.score
    );


    /*
      Her formasyonun yalnızca
      en iyi sonucunu listele.
    */

    const bestPerFormation=[];

    for(const r of results){

      if(
        !bestPerFormation.some(
          x=>x.name===r.name
        )
      ){

        bestPerFormation.push(r);

      }

    }


    const best=results[0];


    /*
      Çok zayıf eşleşmeyi zorla
      sonuç olarak göstermiyoruz.
    */

    if(!best || best.score<54){

      drawPlain(img);

      noMatch(
        "Son mumlarda yeterince güçlü bir AI eşleşmesi bulunamadı."
      );

      showCandidates(
        bestPerFormation
      );

      cameraInput.value="";
      return;

    }


    drawMatch(
      img,
      best
    );

    showBest(best);

    showCandidates(
      bestPerFormation
    );


  }catch(err){

    console.error(err);

    noMatch(
      err.message ||
      "AI analizi sırasında hata oluştu."
    );

  }

  cameraInput.value="";

};


/* ================================
   ADAY PENCERELER
================================ */

function buildCandidates(
  img,
  chart,
  refs
){

  const list=[];

  /*
    Yalnızca grafiğin sağ tarafı.
  */

  const searchLeft=
    chart.x + chart.w*.43;

  const searchRight=
    chart.x + chart.w;


  refs.forEach((ref,refIndex)=>{

    /*
      Her formasyon için iki temel
      pencere genişliği.

      Bu sayı özellikle iPhone'un
      gereksiz yere onlarca AI
      işlemi yapmaması için düşük.
    */

    const widths=[
      chart.w*.23,
      chart.w*.32
    ];


    widths.forEach(width0=>{

      const w=Math.round(width0);

      /*
        Formasyon bölgesinin grafik
        yüksekliğinin yaklaşık yarısını
        kapsaması daha kararlı sonuç verir.
      */

      const h=Math.round(
        chart.h*.52
      );


      /*
        Sağ uç, biraz sol ve orta-sağ.
      */

      const xs=[

        searchRight-w,

        searchRight-w-(chart.w*.10),

        searchRight-w-(chart.w*.20)

      ];


      /*
        Fiyatın farklı seviyelerde
        bulunabilmesi için iki dikey konum.
      */

      const ys=[

        chart.y+chart.h*.14,

        chart.y+chart.h*.34

      ];


      for(const xx of xs){

        for(const yy of ys){

          let x=Math.round(xx);
          let y=Math.round(yy);


          x=Math.max(
            Math.round(searchLeft),
            x
          );


          y=Math.max(
            chart.y,
            Math.min(
              y,
              chart.y+chart.h-h
            )
          );


          const rightDistance=
            searchRight-(x+w);


          const rightBonus=
            Math.max(
              0,
              6-
              (
                rightDistance/
                (chart.w*.25)
              )*6
            );


          const crop=
            cropCanvas(
              img,
              x,y,w,h
            );


          list.push({

            canvas:crop,

            refIndex,

            x,y,w,h,

            rightBonus

          });

        }

      }

    });

  });


  return list;

}


/* ================================
   CANVAS
================================ */

function imageToCanvas(img){

  const c=document.createElement("canvas");

  /*
    CLIP kendisi 224x224 işlem yapıyor.
    Burada Safari belleğini korumak için
    görüntüyü makul boyuta indiriyoruz.
  */

  const max=420;

  let w=img.width;
  let h=img.height;

  const scale=
    Math.min(
      1,
      max/Math.max(w,h)
    );

  w=Math.max(1,Math.round(w*scale));
  h=Math.max(1,Math.round(h*scale));

  c.width=w;
  c.height=h;

  const ctx=c.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,w,h);

  ctx.drawImage(
    img,
    0,0,w,h
  );

  return c;

}


function cropCanvas(
  img,x,y,w,h
){

  const c=document.createElement("canvas");

  /*
    Sabit oran kullanarak farklı adayların
    AI'a benzer büyüklükte gitmesini sağla.
  */

  c.width=320;
  c.height=320;

  const ctx=c.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(
    0,0,
    c.width,
    c.height
  );

  ctx.drawImage(
    img,
    x,y,w,h,
    0,0,
    c.width,
    c.height
  );

  return c;

}


/* ================================
   TENSOR → VEKTÖR
================================ */

function tensorToVectors(
  tensor,
  count
){

  const data=
    Array.from(tensor.data);

  const size=
    Math.floor(
      data.length/count
    );

  const vectors=[];

  for(let i=0;i<count;i++){

    vectors.push(
      data.slice(
        i*size,
        (i+1)*size
      )
    );

  }

  return vectors;

}


/* ================================
   COSINE SIMILARITY
================================ */

function cosineSimilarity(a,b){

  const n=
    Math.min(
      a.length,
      b.length
    );

  let dot=0;
  let aa=0;
  let bb=0;

  for(let i=0;i<n;i++){

    dot+=a[i]*b[i];

    aa+=a[i]*a[i];
    bb+=b[i]*b[i];

  }

  if(!aa || !bb){
    return 0;
  }

  return dot/
    (
      Math.sqrt(aa)*
      Math.sqrt(bb)
    );

}


/* ================================
   SONUÇ ÇİZİMİ
================================ */

function drawPlain(img){

  canvas.width=img.width;
  canvas.height=img.height;

  const ctx=
    canvas.getContext("2d");

  ctx.drawImage(
    img,
    0,0
  );

  canvas.style.display="block";

}


function drawMatch(
  img,
  best
){

  canvas.width=img.width;
  canvas.height=img.height;

  const ctx=
    canvas.getContext("2d");


  ctx.drawImage(
    img,
    0,0
  );


  const line=
    Math.max(
      5,
      Math.round(img.width*.009)
    );


  ctx.strokeStyle="#00d45a";
  ctx.lineWidth=line;

  ctx.strokeRect(
    best.x,
    best.y,
    best.w,
    best.h
  );


  /*
    Yeşil etiket.
  */

  const fontSize=
    Math.max(
      24,
      Math.round(img.width*.038)
    );

  ctx.font=
    "bold "+fontSize+
    "px -apple-system,Arial";

  const label=
    best.name+
    "  %"+
    Math.round(best.score);


  const padding=12;

  const textWidth=
    ctx.measureText(label).width;


  let labelY=
    best.y-fontSize-padding*2;

  if(labelY<0){

    labelY=
      best.y+padding;

  }


  ctx.fillStyle="#00b94f";

  ctx.fillRect(
    best.x,
    labelY,
    textWidth+padding*2,
    fontSize+padding*2
  );


  ctx.fillStyle="#fff";

  ctx.fillText(
    label,
    best.x+padding,
    labelY+fontSize+padding/2
  );


  canvas.style.display="block";

}


/* ================================
   SONUÇ METNİ
================================ */

function showBest(best){

  statusDiv.textContent=
    "✅ AI eşleşmesi bulundu";

  answer.style.display="block";

  answerName.textContent=
    best.name;

  answerScore.textContent=
    "%"+Math.round(best.score);

  answerInfo.innerHTML=
    '<span class="badge">'+
    'Son mum bölgesi'+
    '</span>'+
    '<span class="badge">'+
    'AI görsel eşleştirme'+
    '</span>';

}


function noMatch(message){

  statusDiv.innerHTML=
    "⚠️ Formasyon bulunamadı<br>"+
    '<span style="font-weight:400">'+
    message+
    "</span>";

  answer.style.display="none";

}


/* ================================
   ADAY SONUÇLAR
================================ */

function showCandidates(results){

  topMatches.innerHTML="";

  if(!results.length){
    return;
  }

  const title=
    document.createElement("h3");

  title.textContent=
    "En yakın AI eşleşmeleri";

  topMatches.appendChild(title);


  results
  .slice(0,5)
  .forEach(r=>{

    const row=
      document.createElement("div");

    row.className="match";


    const img=
      document.createElement("img");

    img.src=r.src;


    const text=
      document.createElement("div");

    text.className="matchText";


    const score=
      Math.max(
        0,
        Math.min(
          99,
          Math.round(r.score)
        )
      );


    text.innerHTML=
      "<b>"+
      escapeHTML(r.name)+
      "</b> — %"+
      score+
      '<div class="bar">'+
      '<div class="fill" style="width:'+
      score+
      '%"></div>'+
      "</div>";


    row.append(
      img,
      text
    );

    topMatches.appendChild(row);

  });

}


/* ================================
   RESET
================================ */

function reset(){

  statusDiv.textContent=
    "Hazırlanıyor...";

  answer.style.display="none";

  topMatches.innerHTML="";

  canvas.style.display="none";

}


/* ================================
   YARDIMCILAR
================================ */

function fileURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=
        ()=>resolve(reader.result);

      reader.onerror=
        reject;

      reader.readAsDataURL(file);

    }
  );

}


function loadImg(src){

  return new Promise(
    (resolve,reject)=>{

      const img=
        new Image();

      img.onload=
        ()=>resolve(img);

      img.onerror=
        ()=>reject(
          new Error(
            "Görüntü açılamadı."
          )
        );

      img.src=src;

    }
  );

}


function sleep(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}


function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
