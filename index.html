<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fotoğraf Eşleştir</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;padding:20px;background:#f2f2f7;text-align:center
}
.card{background:#fff;padding:18px;margin:16px 0;border-radius:18px}
.button,button{
  display:block;width:100%;box-sizing:border-box;border:0;
  border-radius:14px;padding:16px;margin:12px 0;
  font-size:17px;font-weight:600;background:#007aff;color:white
}
.delete{background:#ff3b30}
input[type=file]{display:none}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery img{
  width:100%;aspect-ratio:1;object-fit:contain;
  background:white;border-radius:10px
}
.preview,#bestImage{
  max-width:100%;max-height:330px;object-fit:contain;
  border-radius:12px;margin:15px auto
}
#bestImage{display:none}
#result{font-size:19px;font-weight:bold;line-height:1.5}
</style>
</head>

<body>

<h1>📷 Fotoğraf Eşleştir</h1>
<p>Mum formasyonlarını şekil yapısına göre karşılaştır.</p>

<div class="card">
<h2>Referans Fotoğraflar</h2>

<label class="button">
➕ Fotoğraf Ekle
<input id="referenceInput" type="file" accept="image/*" multiple>
</label>

<div id="gallery" class="gallery"></div>

<button id="clearButton" class="delete">Tüm Referansları Sil</button>
<p id="count">0 fotoğraf kayıtlı</p>
</div>

<div class="card">
<h2>Karşılaştır</h2>

<label class="button">
📷 Kamerayla Fotoğraf Çek
<input id="cameraInput" type="file" accept="image/*" capture="environment">
</label>

<img id="cameraPreview" class="preview">
<p id="result">Fotoğraf bekleniyor…</p>
<img id="bestImage">
</div>

<canvas id="canvas" width="96" height="64" style="display:none"></canvas>

<script>
const referenceInput=document.getElementById("referenceInput");
const cameraInput=document.getElementById("cameraInput");
const gallery=document.getElementById("gallery");
const count=document.getElementById("count");
const result=document.getElementById("result");
const cameraPreview=document.getElementById("cameraPreview");
const bestImage=document.getElementById("bestImage");
const clearButton=document.getElementById("clearButton");

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});

const W=96,H=64;
let references=[];

try{
  references=JSON.parse(localStorage.getItem("referencePhotos")||"[]");
}catch(e){references=[]}

function saveReferences(){
  try{
    localStorage.setItem("referencePhotos",JSON.stringify(references));
  }catch(e){
    alert("Telefon depolaması doldu.");
  }
}

function renderGallery(){
  gallery.innerHTML="";
  references.forEach(src=>{
    const img=document.createElement("img");
    img.src=src;
    gallery.appendChild(img);
  });
  count.textContent=references.length+" fotoğraf kayıtlı";
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function resizeImage(src,maxSize=800){
  return new Promise((resolve,reject)=>{
    const img=new Image();

    img.onload=()=>{
      let w=img.width,h=img.height;
      const scale=Math.min(1,maxSize/Math.max(w,h));
      w=Math.round(w*scale);
      h=Math.round(h*scale);

      const c=document.createElement("canvas");
      c.width=w;c.height=h;

      const x=c.getContext("2d");
      x.fillStyle="white";
      x.fillRect(0,0,w,h);
      x.drawImage(img,0,0,w,h);

      resolve(c.toDataURL("image/jpeg",0.82));
    };

    img.onerror=reject;
    img.src=src;
  });
}

/*
  Ortadaki grafik alanına odaklanır.
  Kenarlardaki fiyat, saat ve menülerin etkisini azaltır.
*/
function featureVector(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();

    img.onload=()=>{
      ctx.fillStyle="white";
      ctx.fillRect(0,0,W,H);

      const sx=img.width*0.08;
      const sy=img.height*0.18;
      const sw=img.width*0.84;
      const sh=img.height*0.64;

      ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);

      const data=ctx.getImageData(0,0,W,H).data;
      const gray=new Float32Array(W*H);

      let mean=0;

      for(let i=0,p=0;i<data.length;i+=4,p++){
        const g=data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114;
        gray[p]=g;
        mean+=g;
      }

      mean/=gray.length;

      let variance=0;
      for(const g of gray){
        variance+=(g-mean)*(g-mean);
      }
      variance=Math.sqrt(variance/gray.length)||1;

      /* Parlaklık farkını azalt */
      for(let i=0;i<gray.length;i++){
        gray[i]=(gray[i]-mean)/variance;
      }

      const edges=[];

      for(let y=1;y<H-1;y++){
        for(let x=1;x<W-1;x++){
          const i=y*W+x;

          const gx=
            -gray[i-W-1]+gray[i-W+1]
            -2*gray[i-1]+2*gray[i+1]
            -gray[i+W-1]+gray[i+W+1];

          const gy=
            -gray[i-W-1]-2*gray[i-W]-gray[i-W+1]
            +gray[i+W-1]+2*gray[i+W]+gray[i+W+1];

          edges.push(Math.sqrt(gx*gx+gy*gy));
        }
      }

      resolve(edges);
    };

    img.onerror=reject;
    img.src=src;
  });
}

function cosineSimilarity(a,b){
  let dot=0,aa=0,bb=0;
  const n=Math.min(a.length,b.length);

  for(let i=0;i<n;i++){
    dot+=a[i]*b[i];
    aa+=a[i]*a[i];
    bb+=b[i]*b[i];
  }

  if(!aa||!bb)return 0;
  return dot/(Math.sqrt(aa)*Math.sqrt(bb));
}

/*
  Küçük yatay kaymaları dener.
  Böylece mumlar birkaç piksel sağ/sol farklı olsa da
  sonuç hemen bozulmaz.
*/
function shiftedScore(a,b){
  const row=W-2;
  const rows=H-2;
  let best=0;

  for(let shift=-6;shift<=6;shift+=2){
    let dot=0,aa=0,bb=0;

    for(let y=0;y<rows;y++){
      for(let x=6;x<row-6;x++){
        const bx=x+shift;
        if(bx<0||bx>=row)continue;

        const av=a[y*row+x];
        const bv=b[y*row+bx];

        dot+=av*bv;
        aa+=av*av;
        bb+=bv*bv;
      }
    }

    if(aa&&bb){
      best=Math.max(best,dot/(Math.sqrt(aa)*Math.sqrt(bb)));
    }
  }

  return best;
}

referenceInput.addEventListener("change",async function(){
  for(const file of Array.from(this.files||[])){
    try{
      const original=await fileToDataURL(file);
      references.push(await resizeImage(original));
    }catch(e){}
  }

  saveReferences();
  renderGallery();
  this.value="";
});

clearButton.addEventListener("click",()=>{
  if(confirm("Tüm referans fotoğrafları silinsin mi?")){
    references=[];
    localStorage.removeItem("referencePhotos");
    renderGallery();
    bestImage.style.display="none";
    result.textContent="Fotoğraf bekleniyor…";
  }
});

cameraInput.addEventListener("change",async function(){
  const file=this.files[0];
  if(!file)return;

  if(!references.length){
    result.textContent="Önce referans fotoğraf ekle.";
    return;
  }

  result.textContent="🔎 Mum yapısı analiz ediliyor…";
  bestImage.style.display="none";

  try{
    const original=await fileToDataURL(file);
    const cameraImage=await resizeImage(original);
    cameraPreview.src=cameraImage;

    const target=await featureVector(cameraImage);
    const scores=[];

    for(let i=0;i<references.length;i++){
      const ref=await featureVector(references[i]);

      const direct=cosineSimilarity(target,ref);
      const shifted=shiftedScore(target,ref);

      scores.push({
        index:i,
        src:references[i],
        score:Math.max(direct,shifted)*100
      });
    }

    scores.sort((a,b)=>b.score-a.score);

    const best=scores[0];
    const second=scores[1];

    /*
      Sadece yüksek skor yetmez.
      Birinci sonuç ikinci sonuçtan da belirgin biçimde
      daha iyi olmalıdır.
    */
    const MIN_SCORE=78;
    const MIN_GAP=5;

    const gap=second ? best.score-second.score : 100;

    if(best.score>=MIN_SCORE && gap>=MIN_GAP){
      bestImage.src=best.src;
      bestImage.style.display="block";

      result.innerHTML=
        "✅ Güvenilir eşleşme bulundu.<br>"+
        "Şekil benzerliği: %"+best.score.toFixed(1);
    }else{
      bestImage.style.display="none";

      result.innerHTML=
        "⚠️ Güvenilir eşleşme bulunamadı.<br>"+
        "En yakın sonuç: %"+best.score.toFixed(1);
    }

  }catch(e){
    result.textContent="Karşılaştırma sırasında hata oluştu.";
  }

  this.value="";
});

renderGallery();
</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
