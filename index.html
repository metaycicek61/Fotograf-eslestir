<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fotoğraf Eşleştir - Lens</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:#f4f4f6;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{max-width:700px;margin:auto}
h1{text-align:center;font-size:27px;margin:12px 0 20px}
h2{margin-top:0;font-size:20px}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin:6px 0;
  font-size:17px;
  font-weight:700;
}
.blue{background:#087cff;color:#fff}
.red{background:#ff3b30;color:#fff}
#refs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}
.refItem{
  background:#f7f7f8;
  border-radius:10px;
  padding:5px;
  text-align:center;
}
.refItem img{
  width:100%;
  height:90px;
  object-fit:contain;
  background:white;
  border-radius:7px;
}
.refName{
  font-size:11px;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  margin-top:4px;
}
.small{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-top:7px;
}
#resultCanvas{
  width:100%;
  height:auto;
  display:none;
  border-radius:12px;
  margin-top:12px;
  background:white;
}
.resultBox{
  margin-top:14px;
  padding:15px;
  background:#f4fff6;
  border:2px solid #23a455;
  border-radius:14px;
  text-align:center;
  display:none;
}
.resultName{
  font-size:24px;
  font-weight:800;
}
.score{
  font-size:32px;
  font-weight:900;
  color:#159447;
  margin:5px 0;
}
.badge{
  display:inline-block;
  background:#eaf7ee;
  color:#147a3a;
  border-radius:20px;
  padding:7px 11px;
  margin:4px;
  font-size:13px;
  font-weight:700;
}
#topMatches{margin-top:12px}
.match{
  display:flex;
  gap:10px;
  align-items:center;
  background:#f7f7f8;
  border-radius:11px;
  padding:8px;
  margin:7px 0;
}
.match img{
  width:62px;
  height:55px;
  object-fit:contain;
  background:white;
  border-radius:7px;
}
.matchText{flex:1;font-size:14px}
.bar{
  height:6px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}
.fill{height:100%;background:#087cff}
#status{
  text-align:center;
  font-weight:700;
  margin-top:12px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>🔍 Fotoğraf Eşleştir — Lens</h1>

<div class="card">
<h2>Formasyon Kütüphanesi</h2>

<button class="blue" onclick="refInput.click()">
➕ Formasyon Ekle
</button>

<input id="refInput"
       type="file"
       accept="image/*"
       multiple
       hidden>

<div id="refs"></div>

<button class="red" onclick="clearRefs()">
Tüm Formasyonları Sil
</button>

<div id="count" class="small"></div>
</div>


<div class="card">
<h2>Grafiği Tara</h2>

<button class="blue" onclick="cameraInput.click()">
📷 Kamerayla Grafik Çek
</button>

<input id="cameraInput"
       type="file"
       accept="image/*"
       capture="environment"
       hidden>

<div id="status"></div>

<canvas id="resultCanvas"></canvas>

<div id="resultBox" class="resultBox">
  <div>🎯 Eşleşen Formasyon</div>
  <div id="resultName" class="resultName"></div>
  <div id="resultScore" class="score"></div>
  <div id="resultDetails"></div>
</div>

<div id="topMatches"></div>

</div>
</div>


<script>

const refInput=document.getElementById("refInput");
const cameraInput=document.getElementById("cameraInput");
const refsDiv=document.getElementById("refs");
const countDiv=document.getElementById("count");
const statusDiv=document.getElementById("status");
const canvas=document.getElementById("resultCanvas");
const resultBox=document.getElementById("resultBox");
const resultName=document.getElementById("resultName");
const resultScore=document.getElementById("resultScore");
const resultDetails=document.getElementById("resultDetails");
const topMatches=document.getElementById("topMatches");

let references=[];

/* ESKİ KÜTÜPHANEYİ KORU */
try{
  const old=JSON.parse(localStorage.getItem("chartReferences")||"[]");

  references=old.map((r,i)=>{
    if(typeof r==="string"){
      return {
        name:"Formasyon "+(i+1),
        src:r
      };
    }
    return r;
  });
}catch(e){
  references=[];
}

renderRefs();


/* =========================
   FORMASYON EKLE
========================= */

refInput.addEventListener("change",async e=>{

  const files=[...e.target.files];

  for(const file of files){

    const src=await fileToDataURL(file);

    let name=file.name
      .replace(/\.[^/.]+$/,"")
      .trim();

    if(!name)
      name="Formasyon "+(references.length+1);

    references.push({name,src});
  }

  saveRefs();
  renderRefs();
  refInput.value="";
});


function saveRefs(){
  localStorage.setItem(
    "chartReferences",
    JSON.stringify(references)
  );
}


function renderRefs(){

  refsDiv.innerHTML="";

  references.forEach((r,i)=>{

    const div=document.createElement("div");
    div.className="refItem";

    div.innerHTML=
      `<img src="${r.src}">
       <div class="refName">${escapeHtml(r.name)}</div>`;

    div.onclick=()=>{

      const newName=prompt(
        "Formasyon adı:",
        r.name
      );

      if(newName && newName.trim()){
        references[i].name=newName.trim();
        saveRefs();
        renderRefs();
      }
    };

    refsDiv.appendChild(div);
  });

  countDiv.textContent=
    references.length+
    " formasyon kayıtlı";
}


function clearRefs(){

  if(!confirm(
    "Tüm formasyonlar silinsin mi?"
  )) return;

  references=[];
  saveRefs();
  renderRefs();
}


/* =========================
   KAMERA
========================= */

cameraInput.addEventListener("change",async e=>{

  const file=e.target.files[0];
  if(!file)return;

  if(!references.length){
    alert("Önce formasyon kütüphanesine fotoğraf ekleyin.");
    cameraInput.value="";
    return;
  }

  resultBox.style.display="none";
  canvas.style.display="none";
  topMatches.innerHTML="";

  statusDiv.innerHTML=
    "🔍 Son mumlar taranıyor...";

  try{

    const querySrc=await fileToDataURL(file);
    const queryImg=await loadImage(querySrc);

    await sleep(50);

    const queryData=
      extractCandles(queryImg,true);

    const queryCandles=
      queryData.candles;

    if(queryCandles.length<4){

      statusDiv.innerHTML=
        "❌ Yeterli mum algılanamadı.<br>"+
        queryCandles.length+
        " mum bulundu.";

      cameraInput.value="";
      return;
    }

    const results=[];

    for(let i=0;i<references.length;i++){

      statusDiv.innerHTML=
        "🔍 Formasyon aranıyor...<br>"+
        (i+1)+" / "+references.length;

      const refImg=
        await loadImage(references[i].src);

      const refData=
        extractCandles(refImg,false);

      if(refData.candles.length>=3){

        const match=findBestRecentMatch(
          queryCandles,
          refData.candles
        );

        results.push({
          index:i,
          name:references[i].name,
          src:references[i].src,
          score:match.score,
          start:match.start,
          end:match.end,
          distance:match.distance,
          refCount:refData.candles.length
        });
      }

      await sleep(8);
    }

    if(!results.length){
      statusDiv.innerHTML=
        "❌ Referanslarda yeterli mum algılanamadı.";
      return;
    }

    results.sort((a,b)=>b.score-a.score);

    const best=results[0];

    drawResult(
      queryImg,
      queryData,
      best
    );

    showResults(
      best,
      results,
      queryCandles.length
    );

  }catch(err){

    console.error(err);

    statusDiv.innerHTML=
      "❌ Analiz sırasında hata oluştu.";
  }

  cameraInput.value="";
});


/* =========================
   SON MUMLARDA FORMASYON ARA
========================= */

function findBestRecentMatch(query,ref){

  const n=ref.length;

  let best={
    score:0,
    start:0,
    end:0,
    distance:999
  };

  /*
    SAĞ TARAFA ODAKLAN:
    Yalnızca grafiğin son bölümündeki
    adaylar taranır.
  */

  const searchDepth=
    Math.max(18,n+7);

  const firstPossible=
    Math.max(
      0,
      query.length-searchDepth
    );

  /*
    Referans uzunluğuna göre
    n-1, n ve n+1 mum da denenir.
  */

  const lengths=[
    Math.max(3,n-1),
    n,
    n+1
  ];

  for(const len of lengths){

    if(len>query.length)continue;

    const lastStart=
      query.length-len;

    for(
      let start=firstPossible;
      start<=lastStart;
      start++
    ){

      const end=start+len-1;

      /*
        Eşleşmenin sağ uçtan
        kaç mum uzakta olduğu.
      */
      const distance=
        query.length-1-end;

      /*
        Çok eski adayları at.
        Ana hedef SON MUMLAR.
      */
      if(distance>6)continue;

      const window=
        query.slice(start,start+len);

      let structural=
        compareSequences(window,ref);

      /*
        Son muma yaklaştıkça bonus.
        Tam son mumda bitiyorsa en yüksek.
      */

      const recentBonus=
        Math.max(
          0,
          12-distance*2
        );

      let finalScore=
        structural*0.88+
        recentBonus;

      finalScore=
        Math.max(
          0,
          Math.min(99,finalScore)
        );

      if(finalScore>best.score){

        best={
          score:finalScore,
          start,
          end,
          distance
        };
      }
    }
  }

  return best;
}


/* =========================
   FORMASYON KARŞILAŞTIRMA
========================= */

function compareSequences(a,b){

  const N=12;

  const A=resampleSequence(a,N);
  const B=resampleSequence(b,N);

  const an=normalizeSequence(A);
  const bn=normalizeSequence(B);

  let colorScore=0;
  let bodyScore=0;
  let wickScore=0;
  let positionScore=0;
  let movementScore=0;

  for(let i=0;i<N;i++){

    /* Mum rengi */
    if(A[i].color===B[i].color)
      colorScore+=1;

    /* Gövde büyüklüğü */
    bodyScore+=
      similarity(
        an[i].body,
        bn[i].body,
        0.45
      );

    /* Fitil / toplam yükseklik */
    wickScore+=
      similarity(
        an[i].range,
        bn[i].range,
        0.55
      );

    /* Mumun formasyondaki dikey konumu */
    positionScore+=
      similarity(
        an[i].center,
        bn[i].center,
        0.55
      );

    /* Bir önceki muma göre hareket */
    if(i>0){

      movementScore+=
        similarity(
          an[i].delta,
          bn[i].delta,
          0.45
        );
    }
  }

  colorScore=
    colorScore/N*100;

  bodyScore=
    bodyScore/N*100;

  wickScore=
    wickScore/N*100;

  positionScore=
    positionScore/N*100;

  movementScore=
    movementScore/(N-1)*100;

  /*
    Ağırlıklar:
    Renk dizilimi + mum hareketi
    bizim formasyonlarda daha önemli.
  */

  return (
    colorScore*0.30+
    movementScore*0.25+
    positionScore*0.20+
    bodyScore*0.15+
    wickScore*0.10
  );
}


function normalizeSequence(seq){

  let minY=Infinity;
  let maxY=-Infinity;

  seq.forEach(c=>{
    minY=Math.min(minY,c.minY);
    maxY=Math.max(maxY,c.maxY);
  });

  const range=
    Math.max(1,maxY-minY);

  let previous=null;

  return seq.map(c=>{

    const center=
      ((c.bodyTop+c.bodyBottom)/2-minY)
      /range;

    const body=
      (c.bodyBottom-c.bodyTop+1)
      /range;

    const total=
      (c.maxY-c.minY+1)
      /range;

    let delta=0;

    if(previous!==null)
      delta=center-previous;

    previous=center;

    return{
      center,
      body,
      range:total,
      delta
    };
  });
}


function similarity(a,b,tolerance){

  const d=Math.abs(a-b);

  return Math.max(
    0,
    1-d/tolerance
  );
}


/* =========================
   DİZİYİ EŞİT UZUNLUĞA GETİR
========================= */

function resampleSequence(seq,count){

  if(seq.length===count)
    return seq;

  const result=[];

  for(let i=0;i<count;i++){

    const pos=
      i*(seq.length-1)/
      Math.max(1,count-1);

    const index=
      Math.round(pos);

    result.push(
      seq[Math.min(
        seq.length-1,
        index
      )]
    );
  }

  return result;
}


/* =========================
   MUM ALGILAMA
========================= */

function extractCandles(img,isCamera){

  const MAX_W=720;

  const scale=
    Math.min(1,MAX_W/img.width);

  const W=
    Math.max(
      120,
      Math.round(img.width*scale)
    );

  const H=
    Math.max(
      120,
      Math.round(img.height*scale)
    );

  const c=
    document.createElement("canvas");

  c.width=W;
  c.height=H;

  const ctx=
    c.getContext(
      "2d",
      {willReadFrequently:true}
    );

  ctx.drawImage(img,0,0,W,H);

  const image=
    ctx.getImageData(0,0,W,H);

  const data=image.data;

  const mask=
    new Uint8Array(W*H);

  /*
    Kamera görüntüsünde üst menü ve
    alt kamera bölgesini azalt.
  */

  const topLimit=
    isCamera
      ? Math.floor(H*0.12)
      : 0;

  const bottomLimit=
    isCamera
      ? Math.floor(H*0.88)
      : H;

  for(let y=topLimit;y<bottomLimit;y++){

    for(let x=0;x<W;x++){

      const p=(y*W+x)*4;

      const type=candleColor(
        data[p],
        data[p+1],
        data[p+2]
      );

      if(type)
        mask[y*W+x]=type;
    }
  }


  /*
    X sütunlarında kırmızı/yeşil
    mum piksellerini say.
  */

  const columns=[];

  for(let x=0;x<W;x++){

    let red=0;
    let green=0;

    for(let y=topLimit;y<bottomLimit;y++){

      const v=mask[y*W+x];

      if(v===1)red++;
      if(v===2)green++;
    }

    columns.push({
      red,
      green,
      total:red+green
    });
  }


  /*
    Renkli sütunları gruplandır.
  */

  const groups=[];
  let start=null;

  const minColumn=
    isCamera ? 2 : 1;

  for(let x=0;x<=W;x++){

    const active=
      x<W &&
      columns[x].total>=minColumn;

    if(active && start===null)
      start=x;

    if(!active && start!==null){

      groups.push({
        start,
        end:x-1
      });

      start=null;
    }
  }


  const candles=[];

  for(const g of groups){

    const width=
      g.end-g.start+1;

    if(width>W*0.07)
      continue;

    let red=0;
    let green=0;

    let minY=H;
    let maxY=0;

    const rows=[];

    for(let y=topLimit;y<bottomLimit;y++){

      let rowCount=0;

      for(let x=g.start;x<=g.end;x++){

        const v=mask[y*W+x];

        if(v){
          rowCount++;

          if(v===1)red++;
          if(v===2)green++;

          if(y<minY)minY=y;
          if(y>maxY)maxY=y;
        }
      }

      rows.push({
        y,
        count:rowCount
      });
    }

    if(maxY<=minY)
      continue;

    const height=maxY-minY+1;

    if(height<4)
      continue;

    if(height>H*0.50)
      continue;

    const maxRow=
      Math.max(
        ...rows.map(r=>r.count)
      );

    const threshold=
      Math.max(
        2,
        maxRow*0.55
      );

    let bodyTop=maxY;
    let bodyBottom=minY;

    rows.forEach(r=>{

      if(r.count>=threshold){

        bodyTop=
          Math.min(
            bodyTop,
            r.y
          );

        bodyBottom=
          Math.max(
            bodyBottom,
            r.y
          );
      }
    });

    if(bodyBottom<bodyTop){
      bodyTop=minY;
      bodyBottom=maxY;
    }

    candles.push({
      color:
        green>=red ? 2 : 1,

      minX:g.start,
      maxX:g.end,
      minY,
      maxY,
      bodyTop,
      bodyBottom,
      cx:(g.start+g.end)/2
    });
  }


  /*
    X sırasına koy.
  */

  candles.sort(
    (a,b)=>a.cx-b.cx
  );


  /*
    Çok yakın parçaları birleştir.
  */

  const merged=[];

  for(const cndl of candles){

    const last=
      merged[merged.length-1];

    if(
      last &&
      Math.abs(cndl.cx-last.cx)<=2 &&
      cndl.color===last.color
    ){

      last.minX=
        Math.min(last.minX,cndl.minX);

      last.maxX=
        Math.max(last.maxX,cndl.maxX);

      last.minY=
        Math.min(last.minY,cndl.minY);

      last.maxY=
        Math.max(last.maxY,cndl.maxY);

      last.bodyTop=
        Math.min(last.bodyTop,cndl.bodyTop);

      last.bodyBottom=
        Math.max(last.bodyBottom,cndl.bodyBottom);

      last.cx=
        (last.minX+last.maxX)/2;

    }else{
      merged.push({...cndl});
    }
  }


  /*
    Kamera grafiğinde sağdaki fiyat yazısı
    gibi parçaları azaltmak için mumlar
    arası tipik boşluğu kullan.
  */

  let finalCandles=merged;

  if(isCamera && merged.length>5){

    const gaps=[];

    for(let i=1;i<merged.length;i++)
      gaps.push(
        merged[i].cx-merged[i-1].cx
      );

    const sorted=[...gaps]
      .filter(v=>v>2)
      .sort((a,b)=>a-b);

    const median=
      sorted.length
        ? sorted[Math.floor(sorted.length/2)]
        : 10;

    finalCandles=
      merged.filter((cndl,i,arr)=>{

        const left=
          i>0
            ? cndl.cx-arr[i-1].cx
            : median;

        const right=
          i<arr.length-1
            ? arr[i+1].cx-cndl.cx
            : median;

        return (
          left<median*3.2 ||
          right<median*3.2
        );
      });
  }

  return{
    candles:finalCandles,
    width:W,
    height:H,
    scale
  };
}


/* =========================
   RENK ALGILAMA
========================= */

function candleColor(r,g,b){

  /*
    Kırmızı mumlar
  */
  const red=
    r>125 &&
    r>g*1.22 &&
    r>b*1.12 &&
    (r-g)>28;

  if(red)return 1;


  /*
    Yeşil / turkuaz mumlar
  */
  const green=
    g>105 &&
    g>r*1.12 &&
    g>b*0.82 &&
    (g-r)>20;

  if(green)return 2;

  return 0;
}


/* =========================
   FOTOĞRAF ÜZERİNE ÇERÇEVE
========================= */

function drawResult(img,data,best){

  canvas.width=img.width;
  canvas.height=img.height;

  const ctx=canvas.getContext("2d");

  ctx.drawImage(
    img,
    0,0,
    img.width,
    img.height
  );

  const candles=data.candles;

  if(
    !candles[best.start] ||
    !candles[best.end]
  )return;

  const scaleX=
    img.width/data.width;

  const scaleY=
    img.height/data.height;

  const selected=
    candles.slice(
      best.start,
      best.end+1
    );

  let minX=
    Math.min(
      ...selected.map(c=>c.minX)
    );

  let maxX=
    Math.max(
      ...selected.map(c=>c.maxX)
    );

  let minY=
    Math.min(
      ...selected.map(c=>c.minY)
    );

  let maxY=
    Math.max(
      ...selected.map(c=>c.maxY)
    );

  let x=minX*scaleX;
  let y=minY*scaleY;

  let w=
    (maxX-minX)*scaleX;

  let h=
    (maxY-minY)*scaleY;

  /*
    Çerçeveye biraz boşluk ekle
  */

  const padX=
    Math.max(
      10,
      w*0.15
    );

  const padY=
    Math.max(
      15,
      h*0.25
    );

  x=Math.max(0,x-padX);
  y=Math.max(0,y-padY);

  w=Math.min(
    img.width-x,
    w+padX*2
  );

  h=Math.min(
    img.height-y,
    h+padY*2
  );


  /*
    Yeşil Lens çerçevesi
  */

  ctx.lineWidth=
    Math.max(
      5,
      img.width*0.006
    );

  ctx.strokeStyle="#20b15a";

  ctx.strokeRect(
    x,y,w,h
  );


  /*
    Etiket
  */

  const label=
    best.name+
    "  %"+
    Math.round(best.score);

  const fontSize=
    Math.max(
      22,
      img.width*0.035
    );

  ctx.font=
    "bold "+fontSize+"px -apple-system,Arial";

  const tw=
    ctx.measureText(label).width;

  const labelH=
    fontSize*1.45;

  let labelY=
    y-labelH;

  if(labelY<0)
    labelY=y+5;

  ctx.fillStyle="#20b15a";

  ctx.fillRect(
    x,
    labelY,
    tw+24,
    labelH
  );

  ctx.fillStyle="white";

  ctx.fillText(
    label,
    x+12,
    labelY+fontSize*1.05
  );

  canvas.style.display="block";
}


/* =========================
   SONUÇ
========================= */

function showResults(best,results,totalCandles){

  statusDiv.innerHTML=
    "✅ Tarama tamamlandı<br>"+
    "<span class='small'>"+
    totalCandles+
    " mum algılandı — son mumlar öncelikli tarandı"+
    "</span>";

  resultBox.style.display="block";

  resultName.textContent=
    best.name;

  resultScore.textContent=
    "%"+Math.round(best.score);

  const from=best.start+1;
  const to=best.end+1;

  let endText="";

  if(best.distance===0)
    endText="Son mumda tamamlanıyor";
  else if(best.distance===1)
    endText="Son mumun 1 mum gerisinde";
  else
    endText=
      "Sağ uçtan "+
      best.distance+
      " mum geride";

  resultDetails.innerHTML=
    `<span class="badge">
       Mum ${from}–${to}
     </span>
     <span class="badge">
       ${endText}
     </span>`;

  topMatches.innerHTML=
    "<h3>En yakın adaylar</h3>";

  results
    .slice(0,3)
    .forEach((r,i)=>{

      const div=
        document.createElement("div");

      div.className="match";

      div.innerHTML=
        `<img src="${r.src}">
         <div class="matchText">
           <b>${i+1}. ${escapeHtml(r.name)}</b>
           — %${Math.round(r.score)}
           <div class="bar">
             <div class="fill"
                  style="width:${Math.max(0,Math.min(100,r.score))}%">
             </div>
           </div>
         </div>`;

      topMatches.appendChild(div);
    });
}


/* =========================
   YARDIMCILAR
========================= */

function fileToDataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=
        ()=>resolve(reader.result);

      reader.onerror=reject;

      reader.readAsDataURL(file);
    }
  );
}


function loadImage(src){

  return new Promise(
    (resolve,reject)=>{

      const img=new Image();

      img.onload=
        ()=>resolve(img);

      img.onerror=reject;

      img.src=src;
    }
  );
}


function sleep(ms){
  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );
}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
