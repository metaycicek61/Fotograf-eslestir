<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fotoğraf Eşleştir - Lens</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;background:#f4f4f6;color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.container{max-width:720px;margin:auto}
h1{text-align:center;font-size:26px}
.card{
  background:white;border-radius:18px;padding:16px;margin-bottom:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.08)
}
button{
  width:100%;border:0;border-radius:13px;padding:15px;margin:6px 0;
  font-size:17px;font-weight:700
}
.blue{background:#087cff;color:white}
.red{background:#ff3b30;color:white}
#refs{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;margin:12px 0
}
.ref{
  background:#f6f6f7;border-radius:10px;padding:5px;text-align:center
}
.ref img{
  width:100%;height:90px;object-fit:contain;background:white;border-radius:7px
}
.refName{
  font-size:11px;font-weight:700;margin-top:4px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis
}
.small{text-align:center;color:#666;font-size:13px}
#status{text-align:center;font-weight:700;line-height:1.5;margin:12px 0}
#resultCanvas{
  display:none;width:100%;height:auto;background:white;
  border-radius:12px;margin-top:12px
}
#answer{
  display:none;text-align:center;background:#f0fff4;
  border:2px solid #20a856;border-radius:14px;padding:14px;margin-top:14px
}
#answerName{font-size:25px;font-weight:900}
#answerScore{font-size:34px;font-weight:900;color:#159447}
.badge{
  display:inline-block;padding:7px 11px;border-radius:20px;
  background:#e8f7ed;color:#13773a;font-size:13px;font-weight:700;margin:4px
}
.match{
  display:flex;align-items:center;gap:10px;background:#f7f7f8;
  padding:8px;border-radius:11px;margin:7px 0
}
.match img{
  width:62px;height:55px;object-fit:contain;background:white;border-radius:7px
}
.matchText{flex:1;font-size:14px}
.bar{height:6px;background:#ddd;border-radius:8px;overflow:hidden;margin-top:5px}
.fill{height:100%;background:#087cff}
</style>
</head>

<body>
<div class="container">

<h1>🔍 Fotoğraf Eşleştir — Lens</h1>

<div class="card">
  <h2>Formasyon Kütüphanesi</h2>

  <button class="blue" onclick="refInput.click()">➕ Formasyon Ekle</button>
  <input id="refInput" type="file" accept="image/*" multiple hidden>

  <div id="refs"></div>

  <button class="red" onclick="clearRefs()">Tüm Formasyonları Sil</button>
  <div id="count" class="small"></div>
</div>

<div class="card">
  <h2>Grafiği Tara</h2>

  <button class="blue" onclick="cameraInput.click()">📷 Kamerayla Grafik Çek</button>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>

  <div id="status"></div>

  <canvas id="resultCanvas"></canvas>

  <div id="answer">
    <div>🎯 Eşleşen Formasyon</div>
    <div id="answerName"></div>
    <div id="answerScore"></div>
    <div id="answerInfo"></div>
  </div>

  <div id="topMatches"></div>
</div>

</div>

<script>
const refInput=document.getElementById("refInput");
const cameraInput=document.getElementById("cameraInput");
const refsDiv=document.getElementById("refs");
const countDiv=document.getElementById("count");
const statusDiv=document.getElementById("status");
const canvas=document.getElementById("resultCanvas");
const answer=document.getElementById("answer");
const answerName=document.getElementById("answerName");
const answerScore=document.getElementById("answerScore");
const answerInfo=document.getElementById("answerInfo");
const topMatches=document.getElementById("topMatches");

let references=[];

try{
  let old=JSON.parse(localStorage.getItem("chartReferences")||"[]");

  references=old.map((r,i)=>{
    if(typeof r==="string"){
      return {name:"Formasyon "+(i+1),src:r};
    }

    return {
      name:r.name||("Formasyon "+(i+1)),
      src:r.src||r.data||r.image||""
    };
  }).filter(r=>r.src);
}catch(e){
  references=[];
}

renderRefs();

refInput.addEventListener("change",async e=>{
  const files=[...e.target.files];

  for(const file of files){
    const src=await fileToDataURL(file);
    let name=file.name.replace(/\.[^/.]+$/,"").trim();

    if(!name){
      name="Formasyon "+(references.length+1);
    }

    references.push({name,src});
  }

  saveRefs();
  renderRefs();
  refInput.value="";
});

function saveRefs(){
  localStorage.setItem("chartReferences",JSON.stringify(references));
}

function renderRefs(){
  refsDiv.innerHTML="";

  references.forEach((r,i)=>{
    const item=document.createElement("div");
    item.className="ref";

    const img=document.createElement("img");
    img.src=r.src;

    const name=document.createElement("div");
    name.className="refName";
    name.textContent=r.name;

    item.appendChild(img);
    item.appendChild(name);

    item.addEventListener("click",()=>{
      const n=prompt("Formasyon adı:",r.name);

      if(n && n.trim()){
        references[i].name=n.trim();
        saveRefs();
        renderRefs();
      }
    });

    refsDiv.appendChild(item);
  });

  countDiv.textContent=references.length+" formasyon kayıtlı";
}

function clearRefs(){
  if(!confirm("Tüm formasyonlar silinsin mi?")) return;

  references=[];
  saveRefs();
  renderRefs();
}

cameraInput.addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;

  if(!references.length){
    alert("Önce en az bir formasyon ekleyin.");
    cameraInput.value="";
    return;
  }

  answer.style.display="none";
  canvas.style.display="none";
  topMatches.innerHTML="";
  statusDiv.textContent="🔍 Son mumlar taranıyor...";

  try{
    const querySrc=await fileToDataURL(file);
    const queryImg=await loadImage(querySrc);

    await sleep(30);

    const q=extractCandles(queryImg,true);

    if(q.candles.length<4){
      showNoMatch(
        "Yeterli mum algılanamadı ("+
        q.candles.length+" mum)."
      );

      cameraInput.value="";
      return;
    }

    const results=[];

    for(let i=0;i<references.length;i++){
      statusDiv.innerHTML=
        "🔍 Kütüphane taranıyor...<br>"+
        (i+1)+" / "+references.length;

      const refImg=await loadImage(references[i].src);
      const r=extractCandles(refImg,false);

      if(r.candles.length<3){
        continue;
      }

      const match=findRecentMatch(q.candles,r.candles);

      if(match.valid){
        results.push({
          name:references[i].name,
          src:references[i].src,
          score:match.score,
          start:match.start,
          end:match.end,
          distance:match.distance,
          refCount:r.candles.length
        });
      }

      await sleep(5);
    }

    results.sort((a,b)=>b.score-a.score);

    if(!results.length){
      showNoMatch(
        "Son mumlarda geçerli bir formasyon eşleşmesi bulunamadı."
      );

      drawPlain(queryImg);
      cameraInput.value="";
      return;
    }

    const best=results[0];

    /*
      Çok düşük sonuç artık eşleşme sayılmaz.
    */
    if(best.score<45){
      showNoMatch(
        "Son mumlarda yeterince güçlü bir formasyon bulunamadı."
      );

      drawPlain(queryImg);
      showCandidates(results);
      cameraInput.value="";
      return;
    }

    drawMatch(queryImg,q,best);
    showBest(best,q.candles.length);
    showCandidates(results);

  }catch(err){
    console.error(err);
    showNoMatch("Grafik analiz edilirken hata oluştu.");
  }

  cameraInput.value="";
});


/* =========================================================
   SAĞ UÇ / SON MUMLAR EŞLEŞMESİ
========================================================= */

function findRecentMatch(query,ref){
  if(query.length<3 || ref.length<3){
    return {valid:false};
  }

  let best=null;

  /*
    Referansın gerçek uzunluğuna yakın pencereler.
  */
  const lengths=[
    Math.max(3,ref.length-1),
    ref.length,
    ref.length+1
  ];

  for(const len of lengths){
    if(len>query.length)continue;

    /*
      Yalnızca son 7 mum içinde biten
      formasyonları inceliyoruz.
    */
    const finalStart=query.length-len;
    const earliest=Math.max(0,finalStart-6);

    for(let start=earliest;start<=finalStart;start++){
      const end=start+len-1;
      const distance=(query.length-1)-end;

      if(distance<0 || distance>6)continue;

      const window=query.slice(start,end+1);
      const structure=compareSequences(window,ref);

      /*
        Son muma yakınlık bonusu.
        Son mumda biten formasyon +12.
      */
      const recentBonus=(6-distance)/6*12;

      /*
        Uzakta olan adaya ayrıca küçük ceza.
      */
      const distancePenalty=distance*1.3;

      let score=
        structure*0.90+
        recentBonus-
        distancePenalty;

      score=Math.max(0,Math.min(99,score));

      if(
        !best ||
        score>best.score
      ){
        best={
          valid:true,
          score,
          start,
          end,
          distance
        };
      }
    }
  }

  if(!best){
    return {valid:false};
  }

  return best;
}


/* =========================================================
   FORMASYON YAPISINI KARŞILAŞTIR
========================================================= */

function compareSequences(a,b){
  const N=10;

  const A=resample(a,N);
  const B=resample(b,N);

  const AN=normalize(A);
  const BN=normalize(B);

  let color=0;
  let body=0;
  let range=0;
  let position=0;
  let movement=0;

  for(let i=0;i<N;i++){
    if(A[i].color===B[i].color){
      color++;
    }

    body+=sim(AN[i].body,BN[i].body,.45);
    range+=sim(AN[i].range,BN[i].range,.55);
    position+=sim(AN[i].center,BN[i].center,.55);

    if(i>0){
      movement+=sim(AN[i].delta,BN[i].delta,.45);
    }
  }

  color=color/N*100;
  body=body/N*100;
  range=range/N*100;
  position=position/N*100;
  movement=movement/(N-1)*100;

  /*
    Mum renk sırası + yön/hareket
    en yüksek ağırlıkta.
  */
  return (
    color*.30+
    movement*.27+
    position*.20+
    body*.14+
    range*.09
  );
}

function normalize(seq){
  let min=Infinity;
  let max=-Infinity;

  seq.forEach(c=>{
    min=Math.min(min,c.minY);
    max=Math.max(max,c.maxY);
  });

  const full=Math.max(1,max-min);
  let previous=null;

  return seq.map(c=>{
    const center=
      (((c.bodyTop+c.bodyBottom)/2)-min)/full;

    const body=
      (c.bodyBottom-c.bodyTop+1)/full;

    const range=
      (c.maxY-c.minY+1)/full;

    let delta=0;

    if(previous!==null){
      delta=center-previous;
    }

    previous=center;

    return {center,body,range,delta};
  });
}

function sim(a,b,tolerance){
  return Math.max(
    0,
    1-Math.abs(a-b)/tolerance
  );
}

function resample(seq,count){
  const result=[];

  for(let i=0;i<count;i++){
    const p=i*(seq.length-1)/(count-1);
    const index=Math.round(p);

    result.push(
      seq[Math.min(index,seq.length-1)]
    );
  }

  return result;
}


/* =========================================================
   MUM ALGILAMA
========================================================= */

function extractCandles(img,isCamera){
  const MAX_W=720;
  const scale=Math.min(1,MAX_W/img.width);

  const W=Math.max(120,Math.round(img.width*scale));
  const H=Math.max(120,Math.round(img.height*scale));

  const work=document.createElement("canvas");
  work.width=W;
  work.height=H;

  const ctx=work.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(img,0,0,W,H);

  const image=ctx.getImageData(0,0,W,H);
  const data=image.data;
  const mask=new Uint8Array(W*H);

  /*
    Fotoğrafta menülerin etkisini azalt.
  */
  const top=isCamera ? Math.floor(H*.12) : 0;
  const bottom=isCamera ? Math.floor(H*.88) : H;

  for(let y=top;y<bottom;y++){
    for(let x=0;x<W;x++){
      const p=(y*W+x)*4;

      const color=candleColor(
        data[p],
        data[p+1],
        data[p+2]
      );

      if(color){
        mask[y*W+x]=color;
      }
    }
  }

  /*
    Her X sütununda mum rengi yoğunluğu.
  */
  const col=new Array(W);

  for(let x=0;x<W;x++){
    let red=0;
    let green=0;

    for(let y=top;y<bottom;y++){
      const v=mask[y*W+x];

      if(v===1)red++;
      if(v===2)green++;
    }

    col[x]={red,green,total:red+green};
  }

  /*
    Komşu renkli sütunları aday mum yap.
  */
  const groups=[];
  let start=-1;
  const threshold=isCamera ? 2 : 1;

  for(let x=0;x<=W;x++){
    const active=
      x<W &&
      col[x].total>=threshold;

    if(active && start<0){
      start=x;
    }

    if(!active && start>=0){
      groups.push({start,end:x-1});
      start=-1;
    }
  }

  const candles=[];

  for(const g of groups){
    const width=g.end-g.start+1;

    if(width<1 || width>W*.065){
      continue;
    }

    let red=0;
    let green=0;
    let minY=H;
    let maxY=-1;

    const rows=[];

    for(let y=top;y<bottom;y++){
      let row=0;

      for(let x=g.start;x<=g.end;x++){
        const v=mask[y*W+x];

        if(v){
          row++;

          if(v===1)red++;
          if(v===2)green++;

          minY=Math.min(minY,y);
          maxY=Math.max(maxY,y);
        }
      }

      rows.push({y,count:row});
    }

    if(maxY<0)continue;

    const height=maxY-minY+1;

    if(height<4 || height>H*.50){
      continue;
    }

    const maxRow=Math.max(...rows.map(r=>r.count));

    if(maxRow<1)continue;

    const bodyThreshold=Math.max(2,maxRow*.55);

    let bodyTop=Infinity;
    let bodyBottom=-Infinity;

    rows.forEach(r=>{
      if(r.count>=bodyThreshold){
        bodyTop=Math.min(bodyTop,r.y);
        bodyBottom=Math.max(bodyBottom,r.y);
      }
    });

    if(!Number.isFinite(bodyTop)){
      bodyTop=minY;
      bodyBottom=maxY;
    }

    candles.push({
      color:green>=red ? 2 : 1,
      minX:g.start,
      maxX:g.end,
      minY,
      maxY,
      bodyTop,
      bodyBottom,
      cx:(g.start+g.end)/2
    });
  }

  candles.sort((a,b)=>a.cx-b.cx);

  /*
    Çok yakın bölünmüş mum parçalarını birleştir.
  */
  const merged=[];

  for(const c of candles){
    const last=merged[merged.length-1];

    if(
      last &&
      c.color===last.color &&
      c.cx-last.cx<=2.5
    ){
      last.minX=Math.min(last.minX,c.minX);
      last.maxX=Math.max(last.maxX,c.maxX);
      last.minY=Math.min(last.minY,c.minY);
      last.maxY=Math.max(last.maxY,c.maxY);
      last.bodyTop=Math.min(last.bodyTop,c.bodyTop);
      last.bodyBottom=Math.max(last.bodyBottom,c.bodyBottom);
      last.cx=(last.minX+last.maxX)/2;
    }else{
      merged.push({...c});
    }
  }

  return {
    candles:merged,
    width:W,
    height:H,
    scale
  };
}


/* =========================================================
   KIRMIZI / YEŞİL MUM RENGİ
========================================================= */

function candleColor(r,g,b){
  /*
    Kırmızı
  */
  if(
    r>125 &&
    r>g*1.20 &&
    r>b*1.10 &&
    r-g>25
  ){
    return 1;
  }

  /*
    Yeşil / turkuaz
  */
  if(
    g>100 &&
    g>r*1.10 &&
    g-r>18 &&
    g>=b*.78
  ){
    return 2;
  }

  return 0;
}


/* =========================================================
   FOTOĞRAFIN ÜZERİNE EŞLEŞMEYİ ÇİZ
========================================================= */

function drawMatch(img,data,best){
  canvas.width=img.width;
  canvas.height=img.height;

  const ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,img.width,img.height);

  const selected=
    data.candles.slice(best.start,best.end+1);

  if(!selected.length){
    drawPlain(img);
    return;
  }

  const sx=img.width/data.width;
  const sy=img.height/data.height;

  let minX=Math.min(...selected.map(c=>c.minX))*sx;
  let maxX=Math.max(...selected.map(c=>c.maxX))*sx;
  let minY=Math.min(...selected.map(c=>c.minY))*sy;
  let maxY=Math.max(...selected.map(c=>c.maxY))*sy;

  let w=maxX-minX;
  let h=maxY-minY;

  const px=Math.max(12,w*.15);
  const py=Math.max(18,h*.25);

  let x=Math.max(0,minX-px);
  let y=Math.max(0,minY-py);

  w=Math.min(img.width-x,w+px*2);
  h=Math.min(img.height-y,h+py*2);

  ctx.strokeStyle="#20b15a";
  ctx.lineWidth=Math.max(5,img.width*.006);
  ctx.strokeRect(x,y,w,h);

  const label=
    best.name+"  %"+Math.round(best.score);

  const fontSize=Math.max(22,img.width*.035);

  ctx.font=
    "bold "+fontSize+"px -apple-system,Arial";

  const textWidth=ctx.measureText(label).width;
  const labelHeight=fontSize*1.45;

  let labelY=y-labelHeight;

  if(labelY<0){
    labelY=y+5;
  }

  ctx.fillStyle="#20b15a";
  ctx.fillRect(
    x,
    labelY,
    textWidth+24,
    labelHeight
  );

  ctx.fillStyle="#fff";
  ctx.fillText(
    label,
    x+12,
    labelY+fontSize*1.05
  );

  canvas.style.display="block";
}

function drawPlain(img){
  canvas.width=img.width;
  canvas.height=img.height;

  const ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,img.width,img.height);

  canvas.style.display="block";
}


/* =========================================================
   SONUÇ EKRANI
========================================================= */

function showBest(best,total){
  statusDiv.innerHTML=
    "✅ Tarama tamamlandı<br>"+
    "<span class='small'>"+
    total+
    " mum algılandı — sağ uç öncelikli"+
    "</span>";

  answer.style.display="block";

  answerName.textContent=best.name;
  answerScore.textContent="%"+Math.round(best.score);

  let locationText;

  if(best.distance===0){
    locationText="Son mumda tamamlanıyor";
  }else if(best.distance===1){
    locationText="Son mumun 1 mum gerisinde";
  }else{
    locationText=
      "Son mumun "+
      best.distance+
      " mum gerisinde";
  }

  answerInfo.innerHTML=
    '<span class="badge">Mum '+
    (best.start+1)+"–"+(best.end+1)+
    '</span>'+
    '<span class="badge">'+
    locationText+
    '</span>';
}

function showCandidates(results){
  if(!results.length)return;

  topMatches.innerHTML="<h3>En yakın adaylar</h3>";

  results.slice(0,3).forEach((r,i)=>{
    const row=document.createElement("div");
    row.className="match";

    const img=document.createElement("img");
    img.src=r.src;

    const info=document.createElement("div");
    info.className="matchText";

    const title=document.createElement("div");
    title.innerHTML=
      "<b>"+(i+1)+". "+escapeHtml(r.name)+"</b> — %"+
      Math.round(r.score);

    const bar=document.createElement("div");
    bar.className="bar";

    const fill=document.createElement("div");
    fill.className="fill";
    fill.style.width=
      Math.max(0,Math.min(100,r.score))+"%";

    bar.appendChild(fill);
    info.appendChild(title);
    info.appendChild(bar);

    row.appendChild(img);
    row.appendChild(info);

    topMatches.appendChild(row);
  });
}

function showNoMatch(message){
  answer.style.display="none";

  statusDiv.innerHTML=
    "⚠️ Formasyon bulunamadı<br>"+
    "<span class='small'>"+
    escapeHtml(message)+
    "</span>";
}


/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();

    img.onload=()=>resolve(img);
    img.onerror=reject;

    img.src=src;
  });
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
