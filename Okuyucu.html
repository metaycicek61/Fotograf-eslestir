<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>15×12 Mum Gövde Okuyucu</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:14px;
}

h1{
  text-align:center;
  font-size:21px;
  margin:8px 0 14px;
}

.cameraBox{
  position:relative;
  width:100%;
  aspect-ratio:15/12;
  background:#000;
  overflow:hidden;
  border-radius:14px;
  border:2px solid #555;
}

video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:3;
  pointer-events:none;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin-top:12px;
  font-size:17px;
  font-weight:800;
  background:#087cff;
  color:#fff;
}

#status{
  text-align:center;
  margin:12px 0;
  font-weight:800;
  line-height:1.4;
}

.reader{
  background:#222;
  border-radius:14px;
  padding:12px;
  margin-top:12px;
}

.small{
  color:#bbb;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}

#candles{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:10px 0 4px;
}

.candle{
  flex:0 0 48px;
  border-radius:9px;
  padding:8px 2px;
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.red{background:#6c211e}
.green{background:#155d34}

#sequence{
  margin-top:10px;
  padding:10px;
  background:#181818;
  border-radius:10px;
  font-size:14px;
  line-height:1.7;
  word-break:break-word;
}

#work{display:none}
</style>
</head>

<body>

<div class="wrap">

<h1>📷 15×12 Mum Gövde Okuyucu</h1>

<div class="cameraBox">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<button id="start">Kamerayı Aç</button>

<div id="status">Kamera kapalı.</div>

<div class="reader">
  <b>Gerçek Mum Gövdeleri</b>

  <div class="small">
    Mum gövdelerini bulur. İnce grafik ve MA çizgilerini filtreler.
  </div>

  <div id="candles"></div>
  <div id="sequence">Henüz okuma yok.</div>
</div>

<canvas id="work"></canvas>

</div>

<script>

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const work = document.getElementById("work");
const start = document.getElementById("start");
const status = document.getElementById("status");
const candlesDiv = document.getElementById("candles");
const sequence = document.getElementById("sequence");

let stream = null;
let timer = null;


/* =========================
   KAMERA
========================= */

start.onclick = async () => {

  try{

    if(stream){
      stream.getTracks().forEach(t => t.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    status.textContent = "🟢 Kamera açık — mum gövdeleri aranıyor";
    start.textContent = "Kamerayı Yeniden Aç";

    if(timer) clearInterval(timer);

    timer = setInterval(analyse,300);

  }catch(err){

    console.error(err);

    status.textContent =
      "🔴 Kamera açılamadı. Safari kamera iznini kontrol et.";
  }
};


/* =========================
   RENK TANIMA
========================= */

function candleColor(r,g,b){

  const red =
    r > 105 &&
    r > g * 1.25 &&
    r > b * 1.17 &&
    r - g > 25;

  const green =
    g > 80 &&
    g > r * 1.13 &&
    g > b * 1.05 &&
    g - r > 15;

  if(red) return 1;
  if(green) return 2;

  return 0;
}


/* =========================
   ANALİZ
========================= */

function analyse(){

  if(!video.videoWidth || !video.videoHeight) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const targetRatio = 15/12;

  let sx,sy,sw,sh;

  if(vw/vh > targetRatio){

    sh = vh;
    sw = vh * targetRatio;
    sx = (vw-sw)/2;
    sy = 0;

  }else{

    sw = vw;
    sh = vw/targetRatio;
    sx = 0;
    sy = (vh-sh)/2;
  }

  const W = 450;
  const H = 360;

  work.width = W;
  work.height = H;

  const ctx = work.getContext(
    "2d",
    {willReadFrequently:true}
  );

  ctx.drawImage(
    video,
    sx,sy,sw,sh,
    0,0,W,H
  );

  const image = ctx.getImageData(0,0,W,H);
  const data = image.data;

  const redMask = new Uint8Array(W*H);
  const greenMask = new Uint8Array(W*H);

  for(let y=0;y<H;y++){

    for(let x=0;x<W;x++){

      const p = y*W+x;
      const i = p*4;

      const type = candleColor(
        data[i],
        data[i+1],
        data[i+2]
      );

      if(type===1) redMask[p]=1;
      if(type===2) greenMask[p]=1;
    }
  }

  /*
    Önce renkli piksellerden gerçek
    dikdörtgen gövde adaylarını buluyoruz.
  */

  const redBodies =
    findBodies(redMask,W,H,"red");

  const greenBodies =
    findBodies(greenMask,W,H,"green");

  let bodies = [
    ...redBodies,
    ...greenBodies
  ];

  bodies.sort((a,b)=>a.cx-b.cx);

  bodies = removeNearDuplicates(bodies);

  /*
    Ekranın tamamındaki rastgele renklerden
    oluşabilecek aşırı adayları sınırlıyoruz.
  */

  if(bodies.length > 35){

    bodies = bodies
      .sort((a,b)=>b.score-a.score)
      .slice(0,35)
      .sort((a,b)=>a.cx-b.cx);
  }

  drawOverlay(bodies,W,H);
  showCandles(bodies);
}


/* =========================
   GÖVDE BULUCU
========================= */

function findBodies(mask,W,H,color){

  const bodies=[];

  /*
    Mum gövdesi ararken küçük pencereler
    kullanıyoruz.

    MA çizgisi ince olduğu için pencerenin
    içini yeterince dolduramaz.

    Mum gövdesi ise dikdörtgen ve yoğundur.
  */

  const minWidth = 3;
  const maxWidth = 22;

  const minHeight = 5;
  const maxHeight = 90;

  /*
    Her x konumunda dikey renk dağılımını
    çıkar.
  */

  const columnPixels = new Array(W);

  for(let x=0;x<W;x++){

    const ys=[];

    for(let y=0;y<H;y++){

      if(mask[y*W+x]){
        ys.push(y);
      }
    }

    columnPixels[x]=ys;
  }

  /*
    Birbirine yakın aktif X sütunlarını
    kümeliyoruz.
  */

  let x=0;

  while(x<W){

    if(columnPixels[x].length < 3){
      x++;
      continue;
    }

    let start=x;
    let end=x;

    let gap=0;

    for(let xx=x+1;xx<W;xx++){

      if(columnPixels[xx].length>=3){

        end=xx;
        gap=0;

      }else{

        gap++;

        if(gap>2) break;
      }
    }

    const width=end-start+1;

    if(
      width>=minWidth &&
      width<=maxWidth
    ){

      /*
        Bu X kümesi içinde hangi Y bölgesinin
        gerçekten yoğun olduğunu bul.
      */

      const rowCount =
        new Array(H).fill(0);

      for(let xx=start;xx<=end;xx++){

        for(const yy of columnPixels[xx]){
          rowCount[yy]++;
        }
      }

      const required =
        Math.max(
          2,
          Math.ceil(width*0.45)
        );

      let y=0;

      while(y<H){

        if(rowCount[y] < required){
          y++;
          continue;
        }

        let top=y;
        let bottom=y;
        let yGap=0;

        for(let yy=y+1;yy<H;yy++){

          if(rowCount[yy]>=required){

            bottom=yy;
            yGap=0;

          }else{

            yGap++;

            if(yGap>2) break;
          }
        }

        const height =
          bottom-top+1;

        if(
          height>=minHeight &&
          height<=maxHeight
        ){

          let colored=0;

          for(
            let yy=top;
            yy<=bottom;
            yy++
          ){

            for(
              let xx=start;
              xx<=end;
              xx++
            ){

              if(mask[yy*W+xx]){
                colored++;
              }
            }
          }

          const area =
            width*height;

          const density =
            colored/
            Math.max(1,area);

          /*
            GERÇEK GÖVDE FİLTRESİ

            Yoğunluk yüksek olmalı.
            Böylece ince çapraz MA çizgileri
            elenir.
          */

          if(density >= 0.42){

            /*
              Çok ince ve aşırı uzun şekilleri
              ayrıca reddet.
            */

            const ratio =
              height/
              Math.max(1,width);

            if(ratio <= 12){

              /*
                Gövdenin orta kısmı da dolu mu?
              */

              const midY =
                Math.round((top+bottom)/2);

              let middleFilled=0;

              for(
                let xx=start;
                xx<=end;
                xx++
              ){

                if(mask[midY*W+xx]){
                  middleFilled++;
                }
              }

              const middleRatio =
                middleFilled/
                width;

              if(middleRatio>=0.40){

                const score =
                  density *
                  Math.sqrt(area);

                bodies.push({
                  x:start,
                  y:top,
                  w:width,
                  h:height,
                  cx:start+width/2,
                  cy:top+height/2,
                  color,
                  density,
                  score
                });
              }
            }
          }
        }

        y =
          Math.max(
            y+1,
            bottom+3
          );
      }
    }

    x =
      Math.max(
        x+1,
        end+3
      );
  }

  return bodies;
}


/* =========================
   AYNI MUMU İKİ KEZ
   SAYMAYI ENGELLE
========================= */

function removeNearDuplicates(items){

  if(items.length<2) return items;

  const result=[];

  for(const item of items){

    let duplicateIndex=-1;

    for(let i=0;i<result.length;i++){

      const old=result[i];

      const xDistance =
        Math.abs(item.cx-old.cx);

      const yDistance =
        Math.abs(item.cy-old.cy);

      /*
        Merkezleri çok yakınsa aynı mumun
        iki ayrı parçası olabilir.
      */

      if(
        xDistance < 5 &&
        yDistance < 12
      ){
        duplicateIndex=i;
        break;
      }
    }

    if(duplicateIndex<0){

      result.push(item);

    }else{

      if(
        item.score >
        result[duplicateIndex].score
      ){
        result[duplicateIndex]=item;
      }
    }
  }

  return result.sort(
    (a,b)=>a.cx-b.cx
  );
}


/* =========================
   IZGARA + KUTULAR
========================= */

function drawOverlay(candles,W,H){

  const box =
    overlay.getBoundingClientRect();

  const ow =
    Math.max(
      1,
      Math.round(box.width*2)
    );

  const oh =
    Math.max(
      1,
      Math.round(box.height*2)
    );

  if(
    overlay.width!==ow ||
    overlay.height!==oh
  ){
    overlay.width=ow;
    overlay.height=oh;
  }

  const ctx =
    overlay.getContext("2d");

  ctx.clearRect(
    0,0,
    overlay.width,
    overlay.height
  );

  const cw=overlay.width;
  const ch=overlay.height;

  /*
    15 × 12 IZGARA
  */

  ctx.lineWidth=1;

  ctx.strokeStyle =
    "rgba(255,255,255,.34)";

  for(let i=1;i<15;i++){

    const xx=cw*i/15;

    ctx.beginPath();
    ctx.moveTo(xx,0);
    ctx.lineTo(xx,ch);
    ctx.stroke();
  }

  for(let i=1;i<12;i++){

    const yy=ch*i/12;

    ctx.beginPath();
    ctx.moveTo(0,yy);
    ctx.lineTo(cw,yy);
    ctx.stroke();
  }

  /*
    BULUNAN MUM GÖVDELERİ
  */

  ctx.lineWidth=3;

  candles.forEach(
    (c,index)=>{

      const xx=c.x/W*cw;
      const yy=c.y/H*ch;
      const ww=c.w/W*cw;
      const hh=c.h/H*ch;

      ctx.strokeStyle =
        c.color==="red"
        ?"rgba(255,70,60,.98)"
        :"rgba(30,235,120,.98)";

      ctx.strokeRect(
        xx,yy,ww,hh
      );

      ctx.fillStyle="#fff";

      ctx.font=
        "bold 18px sans-serif";

      ctx.fillText(
        String(index+1),
        xx,
        Math.max(18,yy-4)
      );
    }
  );
}


/* =========================
   SONUÇ
========================= */

function showCandles(candles){

  candlesDiv.innerHTML="";

  if(!candles.length){

    status.textContent =
      "🟡 Gerçek mum gövdesi aranıyor...";

    sequence.textContent =
      "Henüz yeterince net mum gövdesi bulunamadı.";

    return;
  }

  const symbols=[];

  candles.forEach(
    (c,index)=>{

      const div =
        document.createElement("div");

      div.className =
        "candle "+c.color;

      const icon =
        c.color==="red"
        ?"🔴"
        :"🟢";

      div.innerHTML =
        (index+1)+
        "<br>"+
        icon+
        "<br>"+
        "H:"+c.h;

      candlesDiv.appendChild(div);

      symbols.push(
        (index+1)+
        (c.color==="red"
          ?"🔴"
          :"🟢")
      );
    }
  );

  status.textContent =
    "🟢 "+
    candles.length+
    " mum gövdesi bulundu";

  sequence.innerHTML =
    "<b>Soldan sağa sıra:</b><br>"+
    symbols.join(" &nbsp; ");
}

</script>

</body>
</html>
