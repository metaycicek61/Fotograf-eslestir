<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>15×12 Akıllı Mum Okuyucu</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#111;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
 max-width:720px;
 margin:auto;
 padding:14px;
}

h1{
 text-align:center;
 font-size:21px;
 margin:8px 0 14px;
}

.cameraBox{
 position:relative;
 width:100%;
 aspect-ratio:15/12;
 background:#000;
 overflow:hidden;
 border-radius:14px;
 border:2px solid #555;
}

video{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
}

#overlay{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 z-index:3;
 pointer-events:none;
}

button{
 width:100%;
 border:0;
 border-radius:13px;
 padding:15px;
 margin-top:12px;
 font-size:17px;
 font-weight:800;
 background:#087cff;
 color:#fff;
}

#status{
 text-align:center;
 margin:12px 0;
 font-weight:800;
 line-height:1.4;
}

.reader{
 background:#222;
 border-radius:14px;
 padding:12px;
 margin-top:12px;
}

.small{
 color:#bbb;
 text-align:center;
 font-size:12px;
 line-height:1.5;
}

#candles{
 display:flex;
 gap:5px;
 overflow-x:auto;
 padding:10px 0 4px;
}

.candle{
 flex:0 0 48px;
 border-radius:9px;
 padding:8px 2px;
 text-align:center;
 font-size:12px;
 font-weight:700;
}

.red{background:#6c211e}
.green{background:#155d34}

#sequence{
 margin-top:10px;
 padding:10px;
 background:#181818;
 border-radius:10px;
 font-size:14px;
 line-height:1.7;
 word-break:break-word;
}

#work{display:none}
</style>
</head>

<body>

<div class="wrap">

<h1>📷 15×12 Akıllı Mum Okuyucu</h1>

<div class="cameraBox">
 <video id="video" autoplay playsinline muted></video>
 <canvas id="overlay"></canvas>
</div>

<button id="start">Kamerayı Aç</button>

<div id="status">Kamera kapalı.</div>

<div class="reader">
 <b>Gerçek Mum Okuyucu</b>

 <div class="small">
 Kırmızı ve yeşil mum gövdeleri bulunur,
 birbirinden ayrılır ve soldan sağa sıralanır.
 </div>

 <div id="candles"></div>
 <div id="sequence">Henüz okuma yok.</div>
</div>

<canvas id="work"></canvas>

</div>

<script>

const video=document.getElementById("video");
const overlay=document.getElementById("overlay");
const work=document.getElementById("work");
const start=document.getElementById("start");
const status=document.getElementById("status");
const candlesDiv=document.getElementById("candles");
const sequence=document.getElementById("sequence");

let stream=null;
let timer=null;

/* =====================================
   KAMERA
===================================== */

start.onclick=async()=>{

 try{

   if(stream){
     stream.getTracks().forEach(t=>t.stop());
   }

   stream=await navigator.mediaDevices.getUserMedia({
     video:{
       facingMode:{ideal:"environment"},
       width:{ideal:1280},
       height:{ideal:720}
     },
     audio:false
   });

   video.srcObject=stream;
   await video.play();

   status.textContent="🟢 Kamera açık — grafik aranıyor";
   start.textContent="Kamerayı Yeniden Aç";

   if(timer)clearInterval(timer);
   timer=setInterval(analyse,300);

 }catch(err){

   console.error(err);

   status.textContent=
     "🔴 Kamera açılamadı. Safari kamera iznini kontrol et.";
 }
};

/* =====================================
   KIRMIZI / YEŞİL RENK
===================================== */

function candleColor(r,g,b){

 /*
   Geniş renk aralığı.
   Telefon kamerasındaki parlaklık
   değişikliklerini tolere eder.
 */

 const red=
   r>100 &&
   r>g*1.22 &&
   r>b*1.15 &&
   r-g>22;

 const green=
   g>75 &&
   g>r*1.10 &&
   g>b*1.03 &&
   g-r>12;

 if(red)return 1;
 if(green)return 2;

 return 0;
}

/* =====================================
   CANLI ANALİZ
===================================== */

function analyse(){

 if(!video.videoWidth || !video.videoHeight)return;

 const vw=video.videoWidth;
 const vh=video.videoHeight;

 const ratio=15/12;

 let sx,sy,sw,sh;

 if(vw/vh>ratio){

   sh=vh;
   sw=vh*ratio;
   sx=(vw-sw)/2;
   sy=0;

 }else{

   sw=vw;
   sh=vw/ratio;
   sx=0;
   sy=(vh-sh)/2;
 }

 /*
   Analiz çözünürlüğü.
   15×12 ile tam bölünebilir.
 */

 const W=450;
 const H=360;

 work.width=W;
 work.height=H;

 const ctx=work.getContext(
   "2d",
   {willReadFrequently:true}
 );

 ctx.drawImage(
   video,
   sx,sy,sw,sh,
   0,0,W,H
 );

 const image=ctx.getImageData(0,0,W,H);
 const d=image.data;

 /*
   Her X sütununda kırmızı ve yeşil
   mum renkli piksel miktarı.
 */

 const reds=new Array(W).fill(0);
 const greens=new Array(W).fill(0);

 const redTop=new Array(W).fill(H);
 const redBottom=new Array(W).fill(-1);

 const greenTop=new Array(W).fill(H);
 const greenBottom=new Array(W).fill(-1);

 for(let y=0;y<H;y+=2){

   for(let x=0;x<W;x++){

     const i=(y*W+x)*4;

     const type=candleColor(
       d[i],
       d[i+1],
       d[i+2]
     );

     if(type===1){

       reds[x]++;

       if(y<redTop[x])redTop[x]=y;
       if(y>redBottom[x])redBottom[x]=y;

     }else if(type===2){

       greens[x]++;

       if(y<greenTop[x])greenTop[x]=y;
       if(y>greenBottom[x])greenBottom[x]=y;
     }
   }
 }

 /*
   X eksenindeki aktif renk kümelerini bul.
 */

 const redGroups=
   makeGroups(
     reds,
     redTop,
     redBottom,
     "red",
     W,H
   );

 const greenGroups=
   makeGroups(
     greens,
     greenTop,
     greenBottom,
     "green",
     W,H
   );

 let candles=[
   ...redGroups,
   ...greenGroups
 ];

 /*
   Çok yakın kırmızı/yeşil yanlış parçaları
   temizle ve soldan sağa sırala.
 */

 candles=
   candles
   .filter(c=>
     c.w>=2 &&
     c.h>=4 &&
     c.h<H*.75
   )
   .sort((a,b)=>a.cx-b.cx);

 candles=removeDuplicates(candles);

 /*
   Ekranda çok fazla şey algılanırsa
   en anlamlı mum adaylarını tut.
 */

 if(candles.length>40){

   candles=
     candles
     .sort((a,b)=>b.area-a.area)
     .slice(0,40)
     .sort((a,b)=>a.cx-b.cx);
 }

 drawOverlay(candles,W,H);
 showCandles(candles);
}

/* =====================================
   RENK KÜMELERİNİ MUMA ÇEVİR
===================================== */

function makeGroups(
 counts,
 tops,
 bottoms,
 color,
 W,H
){

 const groups=[];

 let start=-1;
 let last=-1;

 for(let x=0;x<W;x++){

   /*
     Gövdeyi yakalamak için aynı X
     çizgisinde birkaç renkli piksel gerekir.
   */

   const active=counts[x]>=3;

   if(active){

     if(start<0)start=x;
     last=x;

   }else if(start>=0){

     /*
       Birkaç piksellik boşluk varsa
       aynı gövdenin devamı olabilir.
     */

     let resume=false;

     for(let k=1;k<=2;k++){

       if(
         x+k<W &&
         counts[x+k]>=3
       ){
         resume=true;
         break;
       }
     }

     if(!resume){

       addGroup(
         groups,
         start,last,
         tops,bottoms,
         counts,color
       );

       start=-1;
       last=-1;
     }
   }
 }

 if(start>=0){

   addGroup(
     groups,
     start,last,
     tops,bottoms,
     counts,color
   );
 }

 return groups;
}

function addGroup(
 groups,
 start,end,
 tops,bottoms,
 counts,color
){

 let top=99999;
 let bottom=-1;
 let pixels=0;

 for(let x=start;x<=end;x++){

   if(tops[x]<top)top=tops[x];
   if(bottoms[x]>bottom)bottom=bottoms[x];

   pixels+=counts[x];
 }

 if(bottom<0)return;

 const w=end-start+1;
 const h=bottom-top+1;

 /*
   İnce yatay yazıları ve büyük
   renkli ekran parçalarını ele.
 */

 if(w>55)return;
 if(w<2)return;
 if(h<4)return;

 /*
   Mum gövdeleri genellikle
   yatay çizgilerden daha yoğun olur.
 */

 const density=
   pixels/
   Math.max(1,w*h/2);

 if(density<.10)return;

 groups.push({
   x:start,
   y:top,
   w,
   h,
   cx:start+w/2,
   cy:top+h/2,
   color,
   area:w*h,
   density
 });
}

/* =====================================
   ÇİFT ALGILAMALARI TEMİZLE
===================================== */

function removeDuplicates(items){

 if(items.length<2)return items;

 const result=[];

 for(const item of items){

   const previous=
     result[result.length-1];

   if(!previous){

     result.push(item);
     continue;
   }

   const distance=
     Math.abs(item.cx-previous.cx);

   /*
     Aynı mum çevresinde iki parça
     bulunduysa daha güçlü olanı seç.
   */

   if(distance<4){

     if(item.area>previous.area){
       result[result.length-1]=item;
     }

   }else{

     result.push(item);
   }
 }

 return result;
}

/* =====================================
   IZGARA + BULUNAN MUMLARI ÇİZ
===================================== */

function drawOverlay(candles,W,H){

 const box=overlay.getBoundingClientRect();

 const ow=Math.max(1,Math.round(box.width*2));
 const oh=Math.max(1,Math.round(box.height*2));

 if(
   overlay.width!==ow ||
   overlay.height!==oh
 ){
   overlay.width=ow;
   overlay.height=oh;
 }

 const ctx=overlay.getContext("2d");

 ctx.clearRect(
   0,0,
   overlay.width,
   overlay.height
 );

 const cw=overlay.width;
 const ch=overlay.height;

 /*
   15 × 12 sabit ızgara
 */

 ctx.lineWidth=1;

 ctx.strokeStyle=
   "rgba(255,255,255,.34)";

 for(let i=1;i<15;i++){

   const x=cw*i/15;

   ctx.beginPath();
   ctx.moveTo(x,0);
   ctx.lineTo(x,ch);
   ctx.stroke();
 }

 for(let i=1;i<12;i++){

   const y=ch*i/12;

   ctx.beginPath();
   ctx.moveTo(0,y);
   ctx.lineTo(cw,y);
   ctx.stroke();
 }

 /*
   Bulunan gerçek mum gövdelerinin
   etrafına kutu.
 */

 ctx.lineWidth=3;

 candles.forEach((c,index)=>{

   const x=c.x/W*cw;
   const y=c.y/H*ch;
   const w=c.w/W*cw;
   const h=c.h/H*ch;

   ctx.strokeStyle=
     c.color==="red"
     ?"rgba(255,70,60,.95)"
     :"rgba(40,220,120,.95)";

   ctx.strokeRect(x,y,w,h);

   ctx.fillStyle="#fff";
   ctx.font="bold 18px sans-serif";

   ctx.fillText(
     String(index+1),
     x,
     Math.max(18,y-3)
   );
 });
}

/* =====================================
   SONUCU GÖSTER
===================================== */

function showCandles(candles){

 candlesDiv.innerHTML="";

 if(!candles.length){

   status.textContent=
     "🟡 Mum gövdesi aranıyor...";

   sequence.textContent=
     "Henüz net mum bulunamadı.";

   return;
 }

 const symbols=[];

 candles.forEach((c,index)=>{

   const div=
     document.createElement("div");

   div.className=
     "candle "+c.color;

   const icon=
     c.color==="red"
     ?"🔴"
     :"🟢";

   div.innerHTML=
     (index+1)+
     "<br>"+
     icon+
     "<br>"+
     "H:"+c.h;

   candlesDiv.appendChild(div);

   symbols.push(
     (index+1)+
     (c.color==="red"?"🔴":"🟢")
   );
 });

 status.textContent=
   "🟢 "+
   candles.length+
   " gerçek mum adayı bulundu";

 sequence.innerHTML=
   "<b>Sıra:</b><br>"+
   symbols.join(" &nbsp; ");
}

</script>

</body>
</html>
