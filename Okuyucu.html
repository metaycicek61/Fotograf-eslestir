<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>15×12 Mum Okuyucu</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#111;
 color:white;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
 max-width:720px;
 margin:auto;
 padding:14px;
}

h1{
 font-size:21px;
 text-align:center;
 margin:8px 0 14px;
}

.cameraBox{
 position:relative;
 width:100%;
 aspect-ratio:15/12;
 background:#000;
 overflow:hidden;
 border-radius:14px;
 border:2px solid #555;
}

video{
 position:absolute;
 width:100%;
 height:100%;
 object-fit:cover;
 left:0;
 top:0;
}

#grid{
 position:absolute;
 inset:0;
 pointer-events:none;
 z-index:2;
}

.v,.h{
 position:absolute;
 background:rgba(255,255,255,.30);
}

.v{
 top:0;
 bottom:0;
 width:1px;
}

.h{
 left:0;
 right:0;
 height:1px;
}

button{
 width:100%;
 border:0;
 border-radius:13px;
 padding:15px;
 margin-top:12px;
 font-size:17px;
 font-weight:800;
 background:#087cff;
 color:white;
}

#status{
 text-align:center;
 margin:12px 0;
 font-weight:700;
}

#reader{
 background:#222;
 border-radius:14px;
 padding:12px;
 margin-top:12px;
}

#candles{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:7px;
 margin-top:10px;
}

.candle{
 background:#333;
 border-radius:9px;
 padding:8px 2px;
 text-align:center;
 font-size:13px;
}

.red{background:#67201d}
.green{background:#155b32}
.empty{background:#333;color:#999}

.small{
 font-size:12px;
 color:#bbb;
 text-align:center;
 line-height:1.5;
}

canvas{display:none}
</style>
</head>

<body>

<div class="wrap">

<h1>📷 15×12 Mum Okuyucu</h1>

<div class="cameraBox">
 <video id="video" autoplay playsinline muted></video>
 <div id="grid"></div>
</div>

<button id="start">Kamerayı Aç</button>

<div id="status">Kamera kapalı.</div>

<div id="reader">
 <b>Canlı Okuyucu</b>
 <div class="small">
 Her dikey sütun kırmızı / yeşil mum açısından taranır.
 </div>

 <div id="candles"></div>
</div>

<canvas id="canvas"></canvas>

</div>

<script>

const video=document.getElementById("video");
const grid=document.getElementById("grid");
const start=document.getElementById("start");
const status=document.getElementById("status");
const candlesDiv=document.getElementById("candles");
const canvas=document.getElementById("canvas");

let stream=null;
let timer=null;

/* ==========================
   15 × 12 IZGARA
========================== */

function createGrid(){

 grid.innerHTML="";

 for(let i=1;i<15;i++){
   const line=document.createElement("div");
   line.className="v";
   line.style.left=(i/15*100)+"%";
   grid.appendChild(line);
 }

 for(let i=1;i<12;i++){
   const line=document.createElement("div");
   line.className="h";
   line.style.top=(i/12*100)+"%";
   grid.appendChild(line);
 }
}

createGrid();

/* ==========================
   KAMERA
========================== */

start.onclick=async()=>{

 try{

   if(stream){
     stream.getTracks().forEach(t=>t.stop());
   }

   stream=await navigator.mediaDevices.getUserMedia({
     video:{
       facingMode:{ideal:"environment"},
       width:{ideal:1280},
       height:{ideal:720}
     },
     audio:false
   });

   video.srcObject=stream;

   await video.play();

   status.textContent="🟢 Kamera açık — mumlar okunuyor";
   start.textContent="Kamerayı Yeniden Aç";

   if(timer)clearInterval(timer);

   timer=setInterval(readCandles,350);

 }catch(err){

   console.error(err);

   status.textContent=
   "🔴 Kamera açılamadı. Safari kamera iznini kontrol et.";
 }
};

/* ==========================
   RENK TANIMA
========================== */

function pixelType(r,g,b){

 /*
   Binance / TradingView benzeri
   kırmızı ve yeşil mumları yakalamak için
   geniş fakat kontrollü eşikler.
 */

 const red=
   r>105 &&
   r>g*1.22 &&
   r>b*1.15;

 const green=
   g>85 &&
   g>r*1.12 &&
   g>b*1.05;

 if(red)return "red";
 if(green)return "green";

 return null;
}

/* ==========================
   CANLI MUM OKUYUCU
========================== */

function readCandles(){

 if(
   !video.videoWidth ||
   !video.videoHeight
 )return;

 /*
   Okuyucu 15×12 oranında çalışır.
   Kamera görüntüsünün merkezinden
   aynı oranlı bölge alınır.
 */

 const vw=video.videoWidth;
 const vh=video.videoHeight;

 const targetRatio=15/12;

 let sw,sh,sx,sy;

 if(vw/vh>targetRatio){

   sh=vh;
   sw=vh*targetRatio;

   sx=(vw-sw)/2;
   sy=0;

 }else{

   sw=vw;
   sh=vw/targetRatio;

   sx=0;
   sy=(vh-sh)/2;
 }

 /*
   Küçük çözünürlük yeterli.
   Telefonu gereksiz yere yormaz.
 */

 const W=300;
 const H=240;

 canvas.width=W;
 canvas.height=H;

 const ctx=canvas.getContext(
   "2d",
   {willReadFrequently:true}
 );

 ctx.drawImage(
   video,
   sx,sy,sw,sh,
   0,0,W,H
 );

 const image=
   ctx.getImageData(0,0,W,H);

 const data=image.data;

 const columnWidth=W/15;

 const result=[];

 for(let c=0;c<15;c++){

   const x1=Math.floor(c*columnWidth);
   const x2=Math.floor((c+1)*columnWidth);

   /*
     Hücre kenarındaki ızgara / komşu mum
     etkisini azaltmak için sütunun
     orta bölümünü okuyoruz.
   */

   const margin=
     Math.max(2,Math.floor(columnWidth*.16));

   let redCount=0;
   let greenCount=0;

   let minY=H;
   let maxY=-1;

   for(
     let y=2;
     y<H-2;
     y+=2
   ){

     for(
       let x=x1+margin;
       x<x2-margin;
       x+=2
     ){

       const i=(y*W+x)*4;

       const r=data[i];
       const g=data[i+1];
       const b=data[i+2];

       const type=pixelType(r,g,b);

       if(type==="red"){
         redCount++;

         if(y<minY)minY=y;
         if(y>maxY)maxY=y;
       }

       if(type==="green"){
         greenCount++;

         if(y<minY)minY=y;
         if(y>maxY)maxY=y;
       }
     }
   }

   const total=
     redCount+greenCount;

   /*
     Çok az renkli piksel varsa
     mum kabul etmiyoruz.
   */

   if(total<7){

     result.push({
       slot:c+1,
       color:"empty",
       strength:0
     });

     continue;
   }

   const color=
     greenCount>redCount
     ?"green"
     :"red";

   const dominant=
     Math.max(redCount,greenCount);

   const strength=
     Math.round(
       dominant/
       Math.max(1,total)*100
     );

   result.push({
     slot:c+1,
     color,
     strength,
     top:minY/H,
     bottom:maxY/H
   });
 }

 showResult(result);
}

/* ==========================
   SONUÇ
========================== */

function showResult(result){

 candlesDiv.innerHTML="";

 let detected=0;

 result.forEach(c=>{

   const box=
     document.createElement("div");

   box.className=
     "candle "+c.color;

   if(c.color==="red"){

     box.innerHTML=
       c.slot+"<br>🔴 "+c.strength+"%";

     detected++;

   }else if(c.color==="green"){

     box.innerHTML=
       c.slot+"<br>🟢 "+c.strength+"%";

     detected++;

   }else{

     box.innerHTML=
       c.slot+"<br>—";
   }

   candlesDiv.appendChild(box);
 });

 status.textContent=
   "🟢 Canlı okuma — "+
   detected+
   "/15 sütunda mum rengi bulundu";
}

</script>

</body>
</html>
